.note-sec{margin-top:32px}

const LV_MAP={easy:2,normal:3,hard:4};
const QUICK_MAP={"1":1,"2":2,"3":3,"4-5":4,"6+":6};
const BAND_MAP={easy:[3,4],normal:[5,6],hard:[7,8]};
const SLOT_TIME_MAP={morning:"07:30",lunch:"12:30",afternoon:"15:30",evening:"19:30"};
function cloneObj(o){return o===undefined||o===null?o:JSON.parse(JSON.stringify(o))}
function _getPlace(c){
  if(!c||!Array.isArray(c.places)||!c.places.length)return null;
  const ap=c.activePlace;
  if(typeof ap==="number")return c.places[ap]||null;
  const idx=c.places.findIndex(p=>p&&(p.id===ap||p.name===ap));
  return c.places[idx>=0?idx:0]||null;
}
function _getSpan(place){
  if(!place)return 0;
  const top=Number(place.topFloor)||0;
  const st=(place.startFloor!==undefined&&place.startFloor!==null&&place.startFloor!=="")?Number(place.startFloor):1;
  return Math.max(0,top-st);
}
function _maxN(c){
  const slots=(c&&Array.isArray(c.slots)&&c.slots.length)?c.slots:[{name:"evening",min:5}];
  const sum=slots.reduce((a,s)=>a+(Number(s&&s.min)||0),0);
  return Math.min(6,Math.max(1,Math.floor(sum/2)));
}
function hardAllowed(c,cf){
  if(!c||!c.joints)return false;
  const medOk=cf?(cf.med==="none"||cf.medAck===true):false;
  return Boolean(c.joints.knee==="none"&&medOk&&c.level==="hard");
}
function initialPlan(c,cf){
  const co=c||{};
  const place=_getPlace(co);
  const span=_getSpan(place);
  const fit=co.fitness||{};
  const f=(Number(fit.fTest)>0)?Number(fit.fTest):(QUICK_MAP[fit.quick]||2);
  const knee=(co.joints&&co.joints.knee)||"none";
  const elevRaw=(place&&place.elevator)||"no";
  const elev=elevRaw==="yes"?"yes":"no";
  let mode="stairs";
  if(knee==="now"||co.stairsLocked||!place||span<1||(elev==="no"&&knee==="mild")){
    mode="flat";
  }
  let R=0;
  if(mode==="stairs"){
    R=Math.max(1,Math.min(span,f));
    if(knee==="mild")R=Math.min(R,2);
  }
  const rawLv=co.level||"easy";
  const effLv=(rawLv==="hard"&&!hardAllowed(co,cf))?"normal":rawLv;
  let pace=effLv;
  if(knee==="mild")pace="easy";
  let N=LV_MAP[effLv]||2;
  if(mode==="stairs"&&elev==="no"&&knee==="none"){
    N=Math.min(N,3);
  }
  N=Math.min(N,_maxN(co));
  const descent=elev==="no"?"slow":"elevator";
  return{R,N,pace,mode,descent};
}
function judge(pace,talk,doneAll,missReason){
  if(missReason==="hard")return"hard";
  if(talk===null||talk===undefined)return"ok";
  const tVal=Number(talk);
  const band=BAND_MAP[pace]||BAND_MAP.easy;
  if(tVal>=9||tVal>band[1])return"hard";
  if(doneAll&&tVal<band[0])return"easy";
  if(pace==="easy"&&doneAll&&tVal===3)return"easy";
  return"ok";
}
// One round's 3-tap answer folded into the day's aggregate. talk/pain keep the hardest value; a "none" round
// only becomes the day's missReason when no round was done at all (spec §3 "못 함(이유)").
function mergeRound(prev,round,plannedRounds){
  const a=prev?cloneObj(prev):{plannedRounds,doneRounds:0,partial:false,talk:null,pain:0,redFlag:false,noneReason:null,rounds:[]};
  a.plannedRounds=plannedRounds;
  const t=(round.talk===undefined||round.talk===null)?null:Number(round.talk);
  const pn=Number(round.pain)||0;
  if(t!==null)a.talk=a.talk===null?t:Math.max(a.talk,t);
  a.pain=Math.max(Number(a.pain)||0,pn);
  a.redFlag=Boolean(a.redFlag||round.redFlag);
  if(round.done==="all"||round.done==="part")a.doneRounds+=1;
  if(round.done!=="all")a.partial=true;
  if(round.done==="none"&&!a.noneReason)a.noneReason=(t!==null&&t>=7.5)?"hard":(pn>=1?"pain":"time");
  a.rounds.push({talk:t,pain:pn,redFlag:Boolean(round.redFlag),done:round.done});
  a.missReason=a.doneRounds===0?a.noneReason:null;
  a.doneAll=a.doneRounds>=a.plannedRounds&&!a.partial;
  return a;
}
function weekKey(today,checkinDow){
  if(!today)return null;
  const cd=(checkinDow===undefined||checkinDow===null)?0:Number(checkinDow);
  const cur=dow(today);
  const diff=(cur-cd+7)%7;
  return addD(today,-diff);
}
// Weekly ladder cap is NET movement in the check-in week: +1 then -1 then -1 is allowed because the net stays within ±1.
function canMove(c,delta,today){
  if(!c||!today)return true;
  const cd=(c.checkinDow===undefined||c.checkinDow===null)?0:Number(c.checkinDow);
  const wk=weekKey(today,cd);
  const log=Array.isArray(c.ladderLog)?c.ladderLog:[];
  let net=0;
  for(const it of log){
    if(it&&it.d&&weekKey(it.d,cd)===wk)net+=Number(it.delta)||0;
  }
  return Math.abs(net+Number(delta))<=1;
}
function ladderUp(plan,c,cf){
  if(!plan)return null;
  const p=cloneObj(plan);
  const co=c||{};
  const mx=_maxN(co);
  if(p.N<6&&p.N<mx){p.N+=1;return p}
  const place=_getPlace(co);
  const span=_getSpan(place);
  const knee=(co.joints&&co.joints.knee)||"none";
  const rLim=knee==="mild"?Math.min(span,2):span;
  if(p.mode==="stairs"&&p.R<rLim){p.R+=1;return p}
  if(p.pace==="easy"&&knee!=="mild"){p.pace="normal";return p}
  if(p.pace==="normal"&&hardAllowed(co,cf)){p.pace="hard";return p}
  return null;
}
function ladderDown(plan){
  if(!plan)return null;
  const p=cloneObj(plan);
  if(p.pace==="hard"){p.pace="normal";return p}
  if(p.pace==="normal"){p.pace="easy";return p}
  if(p.mode==="stairs"&&p.R>1){p.R-=1;return p}
  if(p.N>1){p.N-=1;return p}
  return null;
}
function _pushLadder(c,today,delta,rule){
  if(!Array.isArray(c.ladderLog))c.ladderLog=[];
  c.ladderLog.push({d:today,delta,rule});
  c.ladderLog=c.ladderLog.filter(x=>x&&x.d&&dBtw(x.d,today)<=60);
}
function adherence(c,ss,fromDay,toDay){
  const co=c||{};
  const days=Array.isArray(co.days)?co.days:[1,2,3,4,5];
  const list=Array.isArray(ss)?ss:[];
  const map={};
  list.forEach(s=>{if(s&&s.d)map[s.d]=s});
  const totalD=dBtw(fromDay,toDay);
  let planned=0,done=0,plannedDays=0,doneDays=0;
  const defN=(co.plan&&co.plan.N)||2;
  for(let i=0;i<=totalD;i++){
    const d=addD(fromDay,i);
    if(days.includes(dow(d))){
      plannedDays++;
      const s=map[d];
      const pR=(s&&typeof s.plannedRounds==="number")?s.plannedRounds:defN;
      const dR=(s&&typeof s.doneRounds==="number")?s.doneRounds:0;
      planned+=pR;
      done+=dR;
      if(dR>=1)doneDays++;
    }
  }
  return{planned,done,rate:planned>0?(done/planned):null,plannedDays,doneDays};
}
function applySession(state,s,today){
  const c=cloneObj(state.coach||{});
  const cf=state.cfg||{};
  const past=Array.isArray(state.sessions)?state.sessions:[];
  if(!c.plan)c.plan=initialPlan(c,cf);
  const pBefore=cloneObj(c.plan);
  const plannedRounds=(s.plannedRounds!==undefined&&s.plannedRounds!==null)?Number(s.plannedRounds):pBefore.N;
  const doneRounds=(s.doneRounds!==undefined&&s.doneRounds!==null)?Number(s.doneRounds):(s.missReason||s.bodyStop?0:plannedRounds);
  const doneAll=(s.doneAll!==undefined&&s.doneAll!==null)?Boolean(s.doneAll):(plannedRounds>0&&doneRounds>=plannedRounds);
  const talk=(s.talk===undefined||s.talk===null)?null:Number(s.talk);
  const pain=(s.pain===undefined||s.pain===null)?0:Number(s.pain);
  const redFlag=Boolean(s.redFlag);
  const bodyStop=Boolean(s.bodyStop);

  const secs=Number(s.secs)||0;

  const place=(s.place!==undefined)?s.place:(c.activePlace||0);

  const prev=past.length?past[past.length-1]:null;

  let msgKey="p0",s3Restored=false;
  if(!bodyStop&&!redFlag&&pain===0&&c.s3){
    c.s3.ok=(Number(c.s3.ok)||0)+1;
    if(c.s3.ok>=2){
      c.plan.pace=c.s3.prevPace||c.plan.pace;
      if(c.plan.mode==="stairs"&&c.s3.prevR)c.plan.R=c.s3.prevR;
      c.s3=null;
      s3Restored=true;
      changes.push("S3r");
    }
  }
  if(bodyStop){
    c.stairsLocked=true;
    c.lockReason="body";
    rules.push("S1");
    msgKey="s1";
    changes.push("lock:body");
  }else if(redFlag||pain===2){
    c.stairsLocked=true;
    c.lockReason="knee";
    c.lockUntil=addD(today,7);
    c.plan.mode="flat";
    c.plan.R=0;
    rules.push("S2");
    msgKey="s2";
    changes.push("mode:flat");
  }else if(pain===1){
    if(!c.s3)c.s3={prevPace:c.plan.pace,prevR:c.plan.R,ok:0};
    else c.s3.ok=0;
    c.plan.pace="easy";
    if(c.plan.mode==="stairs")c.plan.R=Math.max(1,c.plan.R-1);
    rules.push("S3");
    msgKey="s3";
    changes.push("pace:easy");
  }else{
    const recentHardMiss=past.filter(x=>x&&x.missReason==="hard"&&(!x.d||(dBtw(x.d,today)>=0&&dBtw(x.d,today)<=6))).length+(missReason==="hard"?1:0);
    const isR2=(judged==="hard"&&prev&&prev.judged==="hard")||recentHardMiss>=2;
    if(isR2){
      if(canMove(c,-1,today)){
        const down=ladderDown(c.plan);
        if(down){
          c.plan=down;
          _pushLadder(c,today,-1,"R2");
          changes.push("ladder:-1");
        }
        rules.push("R2");
        msgKey="r2";
      }else{
        rules.push("R2-capped");
        msgKey="r1";
      }
    }else if(judged==="hard"){
      rules.push("R1");
      msgKey="r1";
    }else if(judged==="easy"&&pain===0&&c.reentry&&today<=c.reentry.until){
      c.plan=cloneObj(c.reentry.prev);
      c.reentry=null;
      rules.push("P1-reentry");
      msgKey="p1";
      changes.push("reentry:restored");
    }else{
      const cd=(c.checkinDow===undefined||c.checkinDow===null)?0:Number(c.checkinDow);
      const wk=weekKey(today,cd);
      const hasUp=Array.isArray(c.ladderLog)&&c.ladderLog.some(x=>x&&x.d&&weekKey(x.d,cd)===wk&&Number(x.delta)>0);
      const prevEasy=Boolean(prev&&prev.judged==="easy"&&(prev.pain===0||prev.pain===undefined||prev.pain===null));
      if(!s3Restored&&judged==="easy"&&pain===0&&prevEasy&&!hasUp&&!c.maintenance&&canMove(c,1,today)){
        const up=ladderUp(c.plan,c,cf);
        if(up){
          c.plan=up;
          _pushLadder(c,today,1,"P1");
          rules.push("P1");
          msgKey="p1";
          changes.push("ladder:+1");
        }else{
          rules.push("P0");
          msgKey="p0";
        }
      }else{
        rules.push("P0");
        msgKey="p0";
      }
    }
  }
  if(s3Restored)rules.push("S3r");
  const session={d:today,slot,place,plannedRounds,doneRounds,R:pBefore.R,pace:pBefore.pace,mode:pBefore.mode,talk,pain,redFlag,bodyStop,missReason,userPick,secs,judged};
  return{coach:c,session,rules,msgKey,changes};
}
function unlock(coachIn,kind,today,painZero){
  const c=cloneObj(coachIn||{});
  const reason=c.lockReason||kind;
  if(!c.stairsLocked&&!reason)return{ok:false,coach:c};
  if(reason==="knee"){
    if(!today||(c.lockUntil&&today<c.lockUntil)||painZero!==true)return{ok:false,coach:c};
  }else if(reason!=="body"){
    return{ok:false,coach:c};
  }
  const curN=(c.plan&&c.plan.N)||2;
  c.stairsLocked=false;
  c.lockReason=null;
  c.lockUntil=null;
  const fresh=initialPlan(c,null);
  c.plan={R:fresh.R,N:Math.max(1,Math.ceil(curN*0.5)),pace:"easy",mode:fresh.mode,descent:fresh.descent};
  return{ok:true,coach:c};
}
function dailyCheck(state,today){
  const c=cloneObj(state.coach||{});
  const cf=state.cfg||{};
  if(!c.plan)c.plan=initialPlan(c,cf);
  const ss=Array.isArray(state.sessions)?state.sessions:[];
  const doneList=ss.filter(x=>x&&x.d&&x.d<=today&&Number(x.doneRounds)>=1).sort((a,b)=>a.d.localeCompare(b.d));
  const last=doneList.length?doneList[doneList.length-1].d:(c.startDate||cf.startDate||today);
  if(c.reentry&&c.reentry.until&&today>c.reentry.until&&doneList.some(x=>x.d>=addD(c.reentry.until,-7)))c.reentry=null;
  const gap=dBtw(last,today);
  const rules=[];
  // M3/M4 count from the last logged session (spec), so they never fire before the first session.
  const hasSession=doneList.length>0;
  if(hasSession&&gap>=14){
    c.needRetest=true;
    if(!c.reentry){
      c.reentry={until:addD(today,7),prev:cloneObj(c.plan)};
      c.plan.N=Math.max(1,Math.ceil(c.plan.N/2));
      c.plan.pace="easy";
    }
    rules.push("M4");
  }else if(hasSession&&gap>=7&&gap<=13&&!c.reentry){
    c.reentry={until:addD(today,7),prev:cloneObj(c.plan)};
    c.plan.N=Math.max(1,Math.ceil(c.plan.N/2));
    c.plan.pace="easy";
    rules.push("M3");
  }else{
    const yest=addD(today,-1);
    const sDate=c.startDate||cf.startDate;
    const days=Array.isArray(c.days)?c.days:[1,2,3,4,5];
    if((!sDate||yest>=sDate)&&days.includes(dow(yest))){
      const ySess=ss.find(x=>x&&x.d===yest);
      if(!ySess||!ySess.doneRounds||Number(ySess.doneRounds)<=0){
        rules.push("M1");
      }
    }
  }
  const askUnlock=Boolean(c.stairsLocked&&c.lockReason==="knee"&&c.lockUntil&&today>=c.lockUntil);
  return{coach:c,rules,askUnlock};
}
function avgWeight(dObj,fromDay,toDay){
  if(!dObj||!fromDay||!toDay)return{avg:null,n:0};
  const len=dBtw(fromDay,toDay);
  let sum=0,n=0;
  for(let i=0;i<=len;i++){
    const d=addD(fromDay,i);
    const e=dObj[d];
    if(e&&typeof e.weight==="number"&&e.weight>0){
      sum+=e.weight;
      n++;
    }
  }
  return{avg:n>0?(sum/n):null,n};
}
function kcalTarget(cfIn,cIn,weight){
  const cf=cfIn||{};
  const co=cIn||{};
  const w=weight||co.lastAvgW||cf.startWeight;
  const base=calcCaloriePlan(Object.assign({},cf,{startWeight:w||cf.startWeight}));
  const tdee=Math.round(base.tdee);
  const adj=Number(co.kcalAdj)||0;
  const goal=cf.goal||"loss";
  const isMaint=Boolean(co.maintenance||goal==="maintain");
  const isLoss=!isMaint&&goal==="loss";
  const lo=Math.max(base.floor,tdee-500);
  const hi=tdee+500;
  const mid=Math.round((base.recMin+base.recMax)/2);
  let target;
  if(isMaint)target=tdee+adj;
  else if(isLoss)target=Math.max(lo,mid+adj);
  else target=Math.min(hi,mid+adj);
  const mn=isLoss?Math.max(lo,target-100):target-100;
  const mxv=(!isMaint&&!isLoss)?Math.min(hi,target+100):target+100;
  return{tdee,target,min:mn,max:Math.max(mn,mxv),lo,hi,atFloor:Boolean(isLoss&&(target-100)<lo)};
}
function checkinDue(c,today){
  if(!c||!today||!c.startDate)return false;
  if(dBtw(c.startDate,today)<7)return false;
  if(!c.lastCheckin)return true;
  const cd=(c.checkinDow===undefined||c.checkinDow===null)?0:Number(c.checkinDow);
  return weekKey(today,cd)!==weekKey(c.lastCheckin,cd);
}
function acceptMaintenance(cIn){
  const c=cloneObj(cIn||{});
  c.maintenance=true;
  c.goalReached=false;
  c.kcalAdj=0;
  return c;
}
function _bestSlot(state){
  if(state.suggestSlot)return state.suggestSlot;
  const ln=state.learn;
  if(ln&&ln.slots&&typeof ln.slots==="object"){
    let best=null,bestR=-1;
    for(const[k,v]of Object.entries(ln.slots)){
      if(v&&typeof v==="object"&&(v.offered>0||v.done>0)){
        const r=(Number(v.done)+1)/(Number(v.offered)+2);
        if(r>bestR){bestR=r;best=k}
      }
    }
    if(best)return best;
  }
  return null;
}
function weeklyCheckin(state,today){
  const c=cloneObj(state.coach||{});
  const cf=cloneObj(state.cfg||{});
  const dObj=state.data||{};
  const ss=Array.isArray(state.sessions)?state.sessions:[];
  if(!c.plan)c.plan=initialPlan(c,cf);
  const startPlan=cloneObj(c.plan),startAdj=Number(c.kcalAdj)||0;
  const from=addD(today,-7),to=addD(today,-1);
  const a=adherence(c,ss,from,to);
  const wNow=avgWeight(dObj,from,to);
  const w14=avgWeight(dObj,addD(today,-21),addD(today,-15));
  const wPrev=avgWeight(dObj,addD(today,-14),addD(today,-8));
  c.firstButton=null;c.suggestSlot=null;
  const rules=[],changes=[];
  const goal=cf.goal||"loss";
  const isMaint=Boolean(c.maintenance||goal==="maintain");
  const isLoss=!isMaint&&goal==="loss";
  const isGain=!isMaint&&goal==="gain";
  if(a.rate!==null&&a.rate<0.5){
    if(canMove(c,-1,today)){
      c.plan.N=Math.max(1,c.plan.N-1);
      _pushLadder(c,today,-1,"M2");
      changes.push("N:"+c.plan.N);
    }
    c.suggestSlot=_bestSlot(state);
    c.firstButton="oneRound";
    rules.push("M2");
  }
  const lossDiff=(w14.n>0&&wNow.n>0)?Math.round((w14.avg-wNow.avg)*1e6)/1e6:null;
  const gainDiff=(w14.n>0&&wNow.n>0)?Math.round((wNow.avg-w14.avg)*1e6)/1e6:null;
  const stall=isLoss?(lossDiff!==null&&lossDiff<0.2):isGain?(gainDiff!==null&&gainDiff<0.2):false;
  if(wNow.n<4){
    rules.push("W-skip");
  }else{
    if(stall&&a.rate!==null&&a.rate<0.7){
      if(a.rate>=0.5){
        if(canMove(c,-1,today)){
          c.plan.N=Math.max(1,c.plan.N-1);
          _pushLadder(c,today,-1,"W1");
          changes.push("N:"+c.plan.N);
        }
        c.suggestSlot=_bestSlot(state);
        c.firstButton="oneRound";
      }
      rules.push("W1");
    }
    c.lastAvgW=wNow.avg;
    rules.push("W2");
    const twoWkOk=!c.lastKcalChange||dBtw(c.lastKcalChange,today)>=14;
    if(isLoss&&!c.maintenance&&a.rate!==null&&a.rate>=0.7&&stall&&twoWkOk){
      const kt=kcalTarget(cf,c,c.lastAvgW);
      if(kt.target-100>=kt.lo){
        c.kcalAdj=(Number(c.kcalAdj)||0)-100;
        c.lastKcalChange=today;
        changes.push("kcal:-100");
      }else if(canMove(c,1,today)){
        const up=ladderUp(c.plan,c,cf);
        if(up){
          c.plan=up;
          _pushLadder(c,today,1,"W3");
          changes.push("ladder:+1");
        }
      }
      rules.push("W3");
    }
    if(isLoss){
      const prevDiff=(wPrev.n>0&&wNow.n>0)?Math.round((wPrev.avg-wNow.avg)*1e6)/1e6:0;
      c.w4Count=prevDiff>1.0?((Number(c.w4Count)||0)+1):0;
      if(c.w4Count>=2){
        const kt=kcalTarget(cf,c,c.lastAvgW);
        if(kt.target+100<=kt.tdee)c.kcalAdj=(Number(c.kcalAdj)||0)+100;
        c.lastKcalChange=today;
        rules.push("W4");
        changes.push("kcal:+100");
      }
    }
    if(isGain&&a.rate!==null&&a.rate>=0.7&&stall&&twoWkOk){
      const kt=kcalTarget(cf,c,c.lastAvgW);
      if(kt.target+100<=kt.tdee+500)c.kcalAdj=(Number(c.kcalAdj)||0)+100;
      c.lastKcalChange=today;
      rules.push("W5");
      changes.push("kcal:+100");
    }
    if(!c.maintenance&&cf.targetWeight&&((goal==="loss"&&wNow.avg<=cf.targetWeight)||(goal==="gain"&&wNow.avg>=cf.targetWeight))){
      c.goalReached=true;
      rules.push("G1");
      changes.push("goalReached:true");
    }
    if(c.maintenance||goal==="maintain"){
      const gDiff=cf.targetWeight?Math.round(Math.abs(wNow.avg-cf.targetWeight)*1e6)/1e6:0;
      c.g2Out=gDiff>1.0?((Number(c.g2Out)||0)+1):0;
      if(c.g2Out>=2){
        c.kcalAdj=(Number(c.kcalAdj)||0)+(wNow.avg>cf.targetWeight?-100:100);
        c.g2Out=0;
        rules.push("G2");
        changes.push("G2:kcal");
      }
    }
  }
  c.lastCheckin=today;
  const z=lang==="zh";
  const kgTxt=(v)=>(v<0?"−":"+")+Math.abs(v).toFixed(1)+"kg";
  const pctN=a.rate!==null?Math.round(a.rate*100):null;
  const inWin=ss.filter(x=>x&&x.d>=from&&x.d<=to);
  const talks=inWin.map(x=>x.talk).filter(v=>typeof v==="number");
  const TALK_KO={3:"노래 가능",5.5:"말은 됨",7.5:"몇 마디만",9:"말 못 함"},TALK_ZH={3:"能唱歌",5.5:"能说话",7.5:"只能说几个字",9:"说不出话"};
  let talkMode=null;
  if(talks.length){const cnt={};talks.forEach(v=>{cnt[v]=(cnt[v]||0)+1});talkMode=Number(Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x]||Number(y)-Number(x))[0])}
  const painCnt=inWin.filter(x=>Number(x.pain)>=1||x.redFlag).length;
  let l1=z?`上周：计划 ${a.planned}轮中完成 ${a.done}轮`:`지난주: 계획 ${a.planned}라운드 중 ${a.done}라운드`;
  if(pctN!==null)l1+=`(${pctN}%)`;
  if(talkMode!==null)l1+=z?` · 呼吸多为「${TALK_ZH[talkMode]}」`:` · 숨 평균 ‘${TALK_KO[talkMode]}’`;
  l1+=z?` · 膝盖不适 ${painCnt}次`:` · 무릎 통증 ${painCnt}회`;
  if(wNow.n>=4){
    l1+=z?` · 7日平均 ${wNow.avg.toFixed(1)}kg`:` · 7일 평균 ${wNow.avg.toFixed(1)}kg`;
    if(w14.n>0)l1+=` (${kgTxt(wNow.avg-w14.avg)})`;
  }
  const nB=startPlan.N,nA=c.plan.N;
  let l2=nB===nA?(z?`本周：每天 ${nA}轮，保持不变`:`이번 주: 하루 ${nA}번 그대로`):(z?`本周：每天 ${nB}轮 → ${nA}轮 (${nA>nB?"+":"−"}${Math.abs(nA-nB)})`:`이번 주: 하루 ${nB}번 → ${nA}번 (${nA>nB?"+":"−"}${Math.abs(nA-nB)})`);
  const kDelta=(Number(c.kcalAdj)||0)-startAdj;
  if(kDelta!==0)l2+=z?` · 建议热量 ${kDelta>0?"+":"−"}${Math.abs(kDelta)}kcal`:` · 권장 칼로리 ${kDelta>0?"+":"−"}${Math.abs(kDelta)}kcal`;
  else if(startPlan.R!==c.plan.R||startPlan.pace!==c.plan.pace)l2+=z?" · 强度有调整":" · 강도 조정";
  const REASON={
    M2:["실행이 절반이 안 돼서, 더 작게 다시 시작해요","完成不到一半，先从更小的量重新开始"],
    W1:["꾸준함 먼저예요. 칼로리는 그대로 두고 횟수를 줄였어요","先保证坚持。热量不变，先减少轮数"],
    W4:["2주 연속 1주에 1kg 넘게 빠졌어요. 조금 더 먹어요","连续两周每周减重超过1kg，适当多吃一点"],
    W3:["실행은 충분한데 체중이 2주째 그대로예요","执行得很好，但体重两周没有变化"],
    W5:["실행은 충분한데 체중이 2주째 그대로예요","执行得很好，但体重两周没有变化"],
    G1:["목표 체중에 닿았어요. 유지 모드를 골라 보세요","已达到目标体重，可以切换到维持模式"],
    G2:["유지 범위를 2주 연속 벗어났어요","连续两周超出维持范围"],
    "W-skip":["체중을 이번 주 4번 기록하면 체중 기반 조정을 해요","本周记录4次体重后，将按体重调整"]
  };
  const order=["M2","W1","W4","W3","W5","G1","G2","W-skip"];
  const top=order.find(k=>rules.includes(k));
  const rTxt=top?REASON[top][z?1:0]:(z?"按计划进行中":"계획대로 가고 있어요");
  const l3=(z?"原因：":"이유: ")+rTxt;
  const status=pctN===null?"none":pctN>=70?"good":pctN>=50?"short":"low";
  const note={wk:today,lines:[l1,l2,l3],rules:rules.slice(),changes:changes.slice(),rate:a.rate,done:a.done,planned:a.planned,status};
  return{coach:c,cfg:cf,note,rules,changes};
}

function defaultCoach(cIn){
  const cf=cIn||cfg||{};
  const pains=Array.isArray(cf.pains)?cf.pains:[];
  const hasKA=pains.includes("knee")||pains.includes("ankle");
  const base={
    v:1,
    startDate:td(),
    places:[],
    activePlace:0,
    joints:{
      knee:hasKA?"mild":"none",
      back:pains.includes("back"),
      ankle:pains.includes("ankle"),
      wrist:pains.includes("wrist")
    },
    fitness:{quick:null,fTest:null,testDate:null},
    slots:[{name:"evening",min:5}],
    days:[1,2,3,4,5],
    equip:[],
    level:"easy",
    plan:null,
    stairsLocked:false,
    lockReason:null,
    lockUntil:null,
    ladderLog:[],
    lastKcalChange:null,
    kcalAdj:0,
    maintenance:false,
    goalReached:false,
    checkinDow:0,
    lastCheckin:null,
    s3:null,
    reentry:null,
    needRetest:false,
    suggestSlot:null,
    g2Out:0,
    w4Count:0,
    lastAvgW:null
  };
  base.plan=initialPlan(base,cf);
  return base;
}
function defaultLearn(){return{slots:{},moves:{},picks:[]}}
function loadCoach(cfIn){
  const cf=cfIn||cfg;
  if(!cf)return null;
  try{
    const raw=localStorage.getItem(COK);
    if(!raw)return defaultCoach(cf);
    const parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))return defaultCoach(cf);
    const def=defaultCoach(cf);
    const merged=Object.assign({},def,parsed,{
      joints:Object.assign({},def.joints,parsed.joints||{}),
      fitness:Object.assign({},def.fitness,parsed.fitness||{})
    });
    if(!merged.plan)merged.plan=initialPlan(merged,cf);
    return merged;

// ═══ STEP 3: Mifflin-St Jeor BMR / TDEE & Speed Guard ═══
const PAL_MAP={sedentary:1.2,light:1.375,standing:1.55,moderate:1.55,labor:1.725,active:1.725};
function resolvePal(palOrWork){
  if(typeof palOrWork==="number"&&palOrWork>0)return palOrWork;
  return PAL_MAP[palOrWork]||1.55;
}
function calcBMR(sex,kg,cm,age){
  const w=Number(kg)||0,h=Number(cm)||0,a=Number(age)||0;
  const base=10*w+6.25*h-5*a;
  return(sex==="f"||sex==="female")?base-161:base+5;
}
function calcTDEE(sex,kg,cm,age,pal){
  return calcBMR(sex,kg,cm,age)*resolvePal(pal);
}
function calcWeeklyRate(start,target,days){
  const d=Number(days)||0;
  if(d<=0)return 0;
  return((Number(start)-Number(target))/(d/7));
}
function calcCaloriePlan(plan){
  const sex=plan.sex||"m";
  const bmr=calcBMR(sex,plan.startWeight,plan.height,plan.age);
  const pal=resolvePal(plan.pal||plan.workType);
  const tdee=bmr*pal;
  const floor=(sex==="f"||sex==="female")?1200:1500;
  const goal=plan.goal||"loss";
  let recMin=Math.round(tdee),recMax=Math.round(tdee),recTarget=Math.round(tdee),clamped=false;
  if(goal==="loss"){
    const rawMin=Math.round(tdee-500),rawMax=Math.round(tdee-300),rawT=Math.round(tdee-400);
    if(rawMin<floor||rawT<floor){clamped=true}
    recMin=Math.max(floor,rawMin);
    recMax=Math.max(floor,rawMax);
    recTarget=Math.max(floor,rawT);
  }else if(goal==="gain"){
    recMin=Math.round(tdee+300);
    recMax=Math.round(tdee+500);
    recTarget=Math.round(tdee+400);
  }
  return{bmr,tdee,bmrRound:Math.round(bmr),tdeeRound:Math.round(tdee),floor,recMin,recMax,recTarget,clamped};
}
function checkBodyAndRate(plan){
  if(!plan||typeof plan!=="object")return{ok:false,blocked:true,code:"invalid",reason:"Invalid plan"};
  const goal=plan.goal||"loss";
  const sex=plan.sex;
  if(sex!=="m"&&sex!=="f"){
    return{ok:false,blocked:true,code:"sex",reason:lang==="zh"?"请选择生理性别。":"성별을 선택하세요."};
  }
  const rawAge=plan.age,rawHt=plan.height,rawSw=plan.startWeight,rawTw=goal==="maintain"?plan.startWeight:plan.targetWeight,rawDays=plan.totalDays!==undefined?plan.totalDays:plan.days;
  if(rawAge===""||rawAge===null||rawAge===undefined||rawHt===""||rawHt===null||rawHt===undefined||rawSw===""||rawSw===null||rawSw===undefined||rawTw===""||rawTw===null||rawTw===undefined||rawDays===""||rawDays===null||rawDays===undefined){
    return{ok:false,blocked:true,code:"range",reason:lang==="zh"?"请输入有效的身体数据与天数(7~180天)。":"나이, 키, 체중, 기간(7~180일)을 올바르게 입력하세요."};
  }
  const sw=Number(rawSw),tw=Number(rawTw),ht=Number(rawHt),age=Number(rawAge),days=Number(rawDays);
  if(!sw||sw<30||sw>300||!tw||tw<30||tw>300||!ht||ht<100||ht>250||!age||age<15||age>100||!days||days<7||days>180){
    return{ok:false,blocked:true,code:"range",reason:lang==="zh"?"请输入有效的身体数据与天数(7~180天)。":"나이, 키, 체중, 기간(7~180일)을 올바르게 입력하세요."};
  }
  const hM=ht/100,bmi=sw/(hM*hM);
  if(goal==="loss"){
    if(bmi<18.5){
      return{ok:false,blocked:true,code:"underweight",reason:lang==="zh"?`当前 BMI (${bmi.toFixed(1)}) 低于 18.5（偏瘦），系统已拦截减重计划。`:`현재 저체중(BMI ${bmi.toFixed(1)} < 18.5)이므로 감량 도전을 시작할 수 없습니다.`};
    }
    if(tw>=sw){
      return{ok:false,blocked:true,code:"loss_dir",reason:lang==="zh"?"减重模式下目标体重必须低于当前体重（或切换为增重/维持模式）。":"감량 모드에서는 목표 체중이 현재 체중보다 낮아야 합니다. (증량/유지 모드로 전환하거나 목표를 수정하세요)"};
    }
    const rate=calcWeeklyRate(sw,tw,days);
    if(rate>2.0){
      return{ok:false,blocked:true,rate,code:"rate_over_2",reason:lang==="zh"?`周均减重 ${rate.toFixed(2)}kg/周 超过 2kg/周安全上限，已阻止开始。请延长天数或调高目标体重。`:`주당 감량 속도(${rate.toFixed(2)}kg/주)가 2kg/주를 초과하여 차단되었습니다. 기간을 늘리거나 목표 체중을 높여주세요.`};
    }
    if(rate>1.0){
      return{ok:false,blocked:true,warn:true,rate,code:"rate_over_1",reason:lang==="zh"?`⚠️ 强烈警告：周均减重 ${rate.toFixed(2)}kg/周 超过 1kg/周建议值！请重新调整挑战天数或目标体重至 ≤1kg/周。`:`⚠️ 강한 경고: 주당 감량 속도가 ${rate.toFixed(2)}kg/주로 권장 기준(1kg/주)을 초과합니다. 건강을 위해 기간을 늘리거나 목표 체중을 다시 설정하세요.`};
    }
  }else if(goal==="gain"){
    if(tw<=sw){
      return{ok:false,blocked:true,code:"gain_dir",reason:lang==="zh"?"增重模式下目标体重必须高于当前体重（或切换为减重/维持模式）。":"증량 모드에서는 목표 체중이 현재 체중보다 높아야 합니다. (감량/유지 모드로 전환하거나 목표를 수정하세요)"};
    }
    const gRate=Math.abs(calcWeeklyRate(sw,tw,days));
    if(gRate>1.5){
      return{ok:false,blocked:true,warn:true,rate:gRate,code:"gain_rate",reason:lang==="zh"?`⚠️ 周均增重 ${gRate.toFixed(2)}kg/周 过快，请延长天数或调整目标体重。`:`⚠️ 주당 증량 속도(${gRate.toFixed(2)}kg/주)가 너무 빠릅니다. 기간이나 목표 체중을 다시 조정해주세요.`};
    }
  }
  return{ok:true,blocked:false,code:"ok",rate:calcWeeklyRate(sw,tw,days)};
}
function canStart(plan){
  if(!plan||typeof plan!=="object")return{ok:false,blocked:true,code:"invalid",reason:"Invalid plan"};
  if(plan.preg==="yes"){
    return{ok:false,blocked:true,safetyStop:true,code:"preg_stop",reason:lang==="zh"?"孕期或哺乳期请不要用这个应用开始运动或饮食计划。请停止使用并咨询专科医生。":"임신·수유 중에는 이 앱으로 운동·식단을 시작하지 마세요. 사용을 멈추고 전문의와 상담하세요."};
  }
  if(plan.ed==="high"){
    return{ok:false,blocked:true,safetyStop:true,code:"ed_stop",reason:lang==="zh"?"如果经常极端节食或暴食，请不要用这个应用开始饮食计划。请停止使用并咨询专业医生。":"극단적인 절식·폭식이 잦다면 이 앱으로 식단을 시작하지 마세요. 사용을 멈추고 전문의와 상담하세요."};
  }
  const bodyChk=checkBodyAndRate(plan);
  if(!bodyChk.ok)return bodyChk;
  if(!plan.med){
    return{ok:false,blocked:true,code:"med_req",reason:lang==="zh"?"请选择目前是否有正在治疗的疾病。":"병원 진료 중인 질환 여부를 선택해주세요."};
  }
  if(plan.med!=="none"&&!plan.medAck){
    return{ok:false,blocked:true,code:"med_ack",reason:lang==="zh"?"请勾选已与医生沟通确认。":"'의사와 상의하고 진행해요'를 확인해주세요."};
  }
  if(!plan.preg){
    return{ok:false,blocked:true,code:"preg_req",reason:lang==="zh"?"请选择是否处于孕期或哺乳期。":"임신·수유 여부를 선택해주세요."};
  }
  if(!plan.ed){
    return{ok:false,blocked:true,code:"ed_req",reason:lang==="zh"?"请选择是否有极端节食或暴食经历。":"극단적인 절식이나 폭식 경험 여부를 선택해주세요."};
  }
  return bodyChk;
}

function getExportObject(){

  return{
    b60lang:lang,
    burn60_config:cfg,

    burn60_user:usr,
    burn60_coach:coach,
    burn60_sessions:sessions,

function exportBackup(){
  const payload=getExportObject();
  const json=JSON.stringify(payload,null,2);
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const dStr=td().replace(/-/g,"");
  a.href=url;
  a.download=`burn60_backup_${dStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),500);
  toast(lang==="zh"?"已导出备份 ✓":"백업 내보내기 완료 ✓");
  return payload;
}
function validateBackupObj(obj){
  if(!obj||typeof obj!=="object"||Array.isArray(obj))return false;
  const reqKeys=["b60lang","burn60_config","burn60_data","burn60_user"];
  for(const k of reqKeys){if(!(k in obj))return false}
  if(typeof obj.b60lang!=="string"||(obj.b60lang!=="ko"&&obj.b60lang!=="zh"))return false;
  if(obj.burn60_config!==null){
    if(typeof obj.burn60_config!=="object"||Array.isArray(obj.burn60_config))return false;
    if(!obj.burn60_config.startDate||!obj.burn60_config.totalDays||!obj.burn60_config.startWeight)return false;
  }
  if(!obj.burn60_data||typeof obj.burn60_data!=="object"||Array.isArray(obj.burn60_data))return false;
  if(!obj.burn60_user||typeof obj.burn60_user!=="object"||Array.isArray(obj.burn60_user)||typeof obj.burn60_user.xp!=="number")return false;
  if("burn60_coach" in obj&&obj.burn60_coach!==undefined&&obj.burn60_coach!==null){
    if(typeof obj.burn60_coach!=="object"||Array.isArray(obj.burn60_coach))return false;
  }
  if("burn60_sessions" in obj&&obj.burn60_sessions!==undefined){
    if(!Array.isArray(obj.burn60_sessions))return false;
  }
  if("burn60_learn" in obj&&obj.burn60_learn!==undefined){
    if(!obj.burn60_learn||typeof obj.burn60_learn!=="object"||Array.isArray(obj.burn60_learn))return false;
  }
  if("burn60_notes" in obj&&obj.burn60_notes!==undefined){
    if(!Array.isArray(obj.burn60_notes))return false;
  }
  return true;
}
function applyBackupObject(rawInput,skipConfirm){
  let obj=rawInput;
  if(typeof rawInput==="string"){
    try{obj=JSON.parse(rawInput)}catch(e){toast(lang==="zh"?"无效的JSON文件":"유효하지 않은 JSON 파일");return false}
  }
  if(!validateBackupObj(obj)){
    toast(lang==="zh"?"备份文件格式错误":"백업 파일 구조가 올바르지 않습니다");
    return false;
  }
  if(!skipConfirm){
    const ok=confirm(lang==="zh"?"导入备份将覆盖当前数据，确定继续？":"백업을 가져오면 현재 데이터를 덮어씁니다. 계속할까요?");
    if(!ok)return false;
  }
  lang=obj.b60lang;
  try{localStorage.setItem("b60lang",lang)}catch(e){}
  if(obj.burn60_config){
    cfg=Object.assign({},obj.burn60_config,{schemaVersion:3});
    saveC(cfg);
    if(obj.burn60_coach&&typeof obj.burn60_coach==="object"){
      const def=defaultCoach(cfg);
      coach=Object.assign({},def,cloneObj(obj.burn60_coach),{
        joints:Object.assign({},def.joints,obj.burn60_coach.joints||{}),
        fitness:Object.assign({},def.fitness,obj.burn60_coach.fitness||{})
      });
      if(!coach.plan)coach.plan=initialPlan(coach,cfg);
    }else{
      coach=defaultCoach(cfg);
    }
    saveCoach(coach);
  }else{
    cfg=null;
    coach=null;
    try{localStorage.removeItem(CK);localStorage.removeItem(COK)}catch(e){}
  }
  data=obj.burn60_data;
  saveD(data);
  usr=obj.burn60_user;
  saveU(usr);
  saveSessions(Array.isArray(obj.burn60_sessions)?cloneObj(obj.burn60_sessions):[]);
  saveLearn((obj.burn60_learn&&typeof obj.burn60_learn==="object")?Object.assign(defaultLearn(),cloneObj(obj.burn60_learn)):defaultLearn());
  saveNotes(Array.isArray(obj.burn60_notes)?cloneObj(obj.burn60_notes):[]);
  syncDocLang();
  render();
  toast(lang==="zh"?"备份导入成功 ✓":"백업 가져오기 완료 ✓");
  return true;
}
function triggerImport(){
  const inp=document.getElementById("import-file-input");
  if(inp)inp.click();
}
function handleImportFile(ev){
  const file=ev.target&&ev.target.files&&ev.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    applyBackupObject(e.target.result,false);
    ev.target.value="";
  };
  reader.readAsText(file);
}

function _todaySession(today2){
  return sessions.find(x=>x&&x.d===today2)||null;
}
function _markExQuestDone(today2){
  if(!data[today2])data[today2]={};
  if(!data[today2].quests)data[today2].quests={};
  if(!data[today2].quests.ex){
    data[today2].quests.ex=true;
    saveD(data);
    usr.xp=calcXP();
    saveU(usr);
  }
}

const ENGINE_FIELDS=["plan","stairsLocked","lockReason","lockUntil","s3","reentry","ladderLog"];
let sessionOpen=false,restNotice=false;
function _engineSnap(c){const o={};ENGINE_FIELDS.forEach(k=>{o[k]=cloneObj(c[k]===undefined?null:c[k])});return o}
function _dayBaseFor(today2){
  if(!coach.dayBase||coach.dayBase.d!==today2)coach.dayBase={d:today2,engine:_engineSnap(coach)};
  return coach.dayBase.engine;
}
function _resnapDayBase(){if(coach&&coach.dayBase&&coach.dayBase.d===td())coach.dayBase.engine=_engineSnap(coach)}
function _learnApply(sess,sign){
  if(!sess)return;
  const sl=sess.slot||"evening",md=sess.mode||"flat";
  if(!learn.slots)learn.slots={};if(!learn.moves)learn.moves={};
  if(!learn.slots[sl])learn.slots[sl]={offered:0,done:0};
  if(!learn.moves[md])learn.moves[md]={offered:0,done:0};
  const p=(Number(sess.plannedRounds)||0)*sign,d=(Number(sess.doneRounds)||0)*sign;
  learn.slots[sl].offered=Math.max(0,learn.slots[sl].offered+p);learn.slots[sl].done=Math.max(0,learn.slots[sl].done+d);
  learn.moves[md].offered=Math.max(0,learn.moves[md].offered+p);learn.moves[md].done=Math.max(0,learn.moves[md].done+d);
}
function _evalToday(agg,bodyStop){
  const today2=td();
  const base=_dayBaseFor(today2);
  const baseCoach=Object.assign(cloneObj(coach),cloneObj(base));
  delete baseCoach.dayBase;delete baseCoach.draft;
  const cur=_todaySession(today2);
  const past=sessions.filter(x=>x&&x.d!==today2);
  const slot=(cur&&cur.slot)||(coach.slots&&coach.slots[0]&&coach.slots[0].name)||"evening";
  const res=applySession({coach:baseCoach,cfg,sessions:past},{plannedRounds:agg.plannedRounds,doneRounds:agg.doneRounds,doneAll:agg.doneAll,talk:agg.talk,pain:agg.pain,redFlag:agg.redFlag,bodyStop:Boolean(bodyStop||(cur&&cur.bodyStop)),missReason:agg.missReason,userPick:null,slot},today2);
  const keepDay=coach.dayBase;
  coach=Object.assign(cloneObj(coach),res.coach,{dayBase:keepDay,draft:null,lastMsgKey:res.msgKey,lastMsgRules:res.rules,lastMsgDate:today2});
  const sess=Object.assign(res.session,{agg});
  _learnApply(cur,-1);_learnApply(sess,1);
  saveLearn(learn,today2);
  saveCoach(coach);
  past.push(sess);
  saveSessions(past,today2);
  if(sess.doneRounds>=1)_markExQuestDone(today2);
  lastCoachMsg=_coachMsgText(res.msgKey,coach);
  return res;
}

function formatMealSummary(meals){
  const z=lang==="zh";
  const arr=Array.isArray(meals)?meals:[];
  const names=z?{bf:"早餐",ln:"午餐",dn:"晚餐",sn:"加餐"}:{bf:"아침",ln:"점심",dn:"저녁",sn:"간식"};
  const hasMain=["bf","ln","dn"].every(k=>arr.includes(k));
  if(hasMain){
    const list=["bf","ln","dn"].concat(arr.includes("sn")?["sn"]:[]).map(k=>names[k]);
    return{text:list.join("·"),empty:false};
  }
  const hr=new Date().getHours();
  const slot=hr<11?"bf":hr<16?"ln":"dn";
  let nextSlot=slot;
  if(arr.includes(nextSlot)){
    nextSlot=["bf","ln","dn"].find(k=>!arr.includes(k))||slot;
  }
  return{text:z?`${names[nextSlot]}还未记录`:`${names[nextSlot]} 아직 없음`,empty:true};
}

          <button type="button" class="choice ${dr.talk===5.5?"on":""}" data-testid="talk-5.5" onclick="answerRound('talk',5.5)"><span>${z?"能说话":"말은 됨"}</span></button>
          <button type="button" class="choice ${dr.talk===7.5?"on":""}" data-testid="talk-7.5" onclick="answerRound('talk',7.5)"><span>${z?"只能说几个字":"몇 마디만"}</span></button>
          <button type="button" class="choice ${dr.talk===9?"on":""}" data-testid="talk-9" onclick="answerRound('talk',9)"><span>${z?"说不出话":"말 못 함"}</span></button>
        </div>
      </div>`;
  }else if(step===2){
    body=`
      <div>
        <div class="step-meta"><span>2 / 3</span><div class="dots"><i></i><i class="on"></i><i></i></div></div>
        <h1 class="q-title" style="margin-top:16px">${z?"膝盖怎么样？":"무릎은 어땠어요?"}</h1>
      </div>
      <div class="session-bottom">
        <label class="flag-row" style="margin-bottom:12px">
          <input type="checkbox" data-testid="chk-redflag" ${dr.redFlag?"checked":""} onchange="toggleRedFlag()">
          <span>${z?"出现了警告信号（肿胀·卡住·无法承重）":"경고 신호가 있었어요(붓기·걸림·체중 못 실음)"}</span>
        </label>
        <div class="choices">
          <button type="button" class="choice ${dr.pain===0?"on":""}" data-testid="pain-0" onclick="answerRound('pain',0)"><span>${z?"没问题":"괜찮아요"}</span></button>
          <button type="button" class="choice ${dr.pain===1?"on":""}" data-testid="pain-1" onclick="answerRound('pain',1)"><span>${z?"有点不舒服":"조금 불편해요"}</span></button>
          <button type="button" class="choice ${dr.pain===2?"on":""}" data-testid="pain-2" onclick="answerRound('pain',2)"><span>${z?"很痛":"많이 아파요"}</span></button>
        </div>
      </div>`;
  }else{
    body=`
      <div>
        <div class="step-meta"><span>3 / 3</span><div class="dots"><i></i><i></i><i class="on"></i></div></div>
        <h1 class="q-title" style="margin-top:16px">${z?"刚才按计划完成了吗？":"방금 계획한 만큼 다 했나요?"}</h1>
      </div>
      <div class="session-bottom">
        <div class="choices">
          <button type="button" class="choice" data-testid="done-all" onclick="answerRound('done','all')"><span>${z?"全部完成":"전부 했어요"}</span></button>
          <button type="button" class="choice" data-testid="done-part" onclick="answerRound('done','part')"><span>${z?"做了一部分":"일부만 했어요"}</span></button>
          <button type="button" class="choice" data-testid="done-none" onclick="answerRound('done','none')"><span>${z?"没做成":"못 했어요"}</span></button>
        </div>
      </div>`;
  }
  return`<div class="screen-wrap no-tabs" data-testid="check-sheet">
    ${renderTopBar()}
    <div class="page-body session-sheet">${body}</div>
    <div class="foot-dock no-tabs">
      ${step>1?`<button type="button" class="btn-text" onclick="roundStepBack()">${z?"上一步":"이전"}</button>`:""}
      <button type="button" class="btn-text" data-testid="btn-later-session" onclick="laterRound()">${z?"稍后继续":"나중에 이어서"}</button>
    </div>
  </div>`;
}

function renderWeekly(){
  const z=lang==="zh";
  const nt=(coach&&coach.unreadNote)||{lines:[],rules:[],rate:null,done:0,planned:0,status:"none"};
  const hasRate=(nt.rate!==null&&nt.rate!==undefined&&!Number.isNaN(Number(nt.rate)));
  const pctTxt=hasRate?`${Math.round(Number(nt.rate)*100)}%`:(z?"暂无记录":"아직 없음");
  const statusMap={
    good:{cls:"good",ko:"계획은 대부분 지켰어요",zh:"计划大部分都完成了"},
    short:{cls:"warn",ko:"조금 모자랐어요",zh:"稍微差了一点"},
    low:{cls:"warn",ko:"이번 주는 더 작게 가요",zh:"这周从更小的量开始"},
    none:{cls:"",ko:"지난주 기록이 아직 없어요",zh:"上周还没有记录"}
  };
  const st=statusMap[nt.status]||statusMap.none;
  const visRules=(Array.isArray(nt.rules)?nt.rules:[]).filter(r=>r&&r!=="W2");
  const ruleTag=visRules.length?` <span class="rule-tag">[${visRules.join(", ")}]</span>`:"";
  const lines=Array.isArray(nt.lines)?nt.lines:[];
  return`<div class="screen-wrap no-tabs" data-testid="weekly-note">
    ${renderTopBar()}
    <div class="page-body">
      <div class="page-title">${z?"每周回顾":"주간 체크인"}</div>
      <div class="hero">
        <div class="hero-label">${z?"上周完成率":"지난주 실행률"}</div>
        <div class="hero-num ${hasRate?"":"rest-txt"}" data-testid="weekly-rate">${pctTxt}</div>
        <div class="hero-sub">${Number(nt.done)||0} / ${Number(nt.planned)||0} ${z?"轮":"라운드"}</div>
        <div class="hero-status ${st.cls}">${z?st.zh:st.ko}</div>
      </div>
      <div class="note-sec">
        <h2 class="note-h">${z?"教练笔记":"코치 노트"}</h2>
        ${lines.map((ln,idx)=>`<p class="note-p">${ln}${idx===lines.length-1?ruleTag:""}</p>`).join("")}
      </div>
    </div>
    <div class="foot-dock no-tabs">
      <button type="button" class="btn-primary" data-testid="btn-weekly-ok" onclick="ackWeeklyNote()">${z?"知道了":"알겠어요"}</button>
    </div>
  </div>`;
}

function renderToday(today2){
  if(!coach)coach=loadCoach(cfg);
  const z=lang==="zh";
  const pl=coach.plan||initialPlan(coach,cfg);
  const tSess=_todaySession(today2);
  const done=tSess?Number(tSess.doneRounds)||0:0;
  const planned=(tSess&&typeof tSess.plannedRounds==="number")?tSess.plannedRounds:(Number(pl.N)||1);
  const rem=Math.max(0,planned-done);
  const pctR=planned>0?Math.min(100,Math.round((done/planned)*100)):0;
  const isWorkDay=Array.isArray(coach.days)&&coach.days.includes(dow(today2));
  const hasDraft=Boolean(coach.draft&&coach.draft.d===today2);
  const dailyRules=Array.isArray(coach.dailyRules)?coach.dailyRules:[];
  const canAskKnee=Boolean(coach.stairsLocked&&coach.lockReason==="knee"&&(!coach.lockUntil||today2>=coach.lockUntil));

  let planLine="";
  if(coach.stairsLocked){
    planLine=coach.lockReason==="body"
      ?(z?"因身体停止信号，爬楼已暂停，改为平地快走":"몸 이상 신호로 계단이 잠겨 평지 걷기로 대체해요")
      :(z?`因膝盖保护，至 ${coach.lockUntil||""} 改为平地快走`:`무릎 보호를 위해 ${coach.lockUntil||""}까지 평지 걷기로 대체해요`);
  }else if(pl.mode==="stairs"){
    const descTxt=pl.descent==="slow"
      ?(z?"下楼请扶好扶手慢走":"내려올 땐 손잡이 잡고 천천히")
      :(z?"下楼请坐电梯":"내려올 땐 엘리베이터");
    planLine=z?`爬 ${pl.R} 层 · ${descTxt}`:`${pl.R}층 올라가기 · ${descTxt}`;
  }else{
    planLine=z?"平地快走·原地踏步 3分钟":"빠르게 걷기·제자리 걷기 3분";
  }

  const tD=data[today2]||{};
  const waterCups=Number(tD.water)||0;
  const waterTxt=waterCups>0?(z?`${waterCups}杯`:`${waterCups}컵`):(z?"暂无记录":"아직 없음");
  const hasWeight=typeof tD.weight==="number"&&tD.weight>0;
  const weightTxt=hasWeight?`${tD.weight}kg`:(z?"今天还未记录":"오늘 아직 없음");
  const mealInfo=formatMealSummary(tD.meals);
  const curMeals=Array.isArray(tD.meals)?tD.meals:[];

  let summaryTxt="";
  if(hasDraft){
    summaryTxt=z?"请继续完成本次记录。":"세션 기록을 이어서 남겨 주세요.";
  }else if((tSess&&tSess.judged)||coach.lastMsgDate===today2){
    const mk=coach.lastMsgKey||"p0";
    const rawMsg=_coachMsgText(mk,coach);
    if(mk==="s1"||mk==="s2")summaryTxt=`<span class="bad">${rawMsg}</span>`;
    else if(mk==="s3"||mk==="r1"||mk==="r2")summaryTxt=`<span class="warn">${rawMsg}</span>`;
    else summaryTxt=rawMsg;
  }else if(coach.firstButton==="oneRound"){
    summaryTxt=z?"今天只做 1 轮就足够了。":"오늘은 1번만 해도 충분해요.";
  }else if(coach.reentry&&today2<=coach.reentry.until){
    summaryTxt=z?"欢迎回来！这周先从一半的量、轻松强度开始。":"다시 와서 반가워요! 이번 주는 절반만, 쉽게 시작해요.";
  }else if(dailyRules.includes("M1")){
    summaryTxt=z?"昨天休息了。没关系，偶尔漏一次不会破坏习惯。今天从1轮开始。":"어제는 쉬었네요. 괜찮아요, 한 번 쉰다고 습관이 무너지진 않아요. 오늘 1라운드부터 해요.";
  }else if(!isWorkDay){
    summaryTxt=z?"今天休息，明天再见。":"오늘은 쉬어요. 내일 다시 만나요.";
  }else if(rem>0){
    summaryTxt=z?`今天再做 ${rem} 轮，计划就完成了。`:`오늘 남은 ${rem}번이면 계획이 끝나요.`;
  }else{
    summaryTxt=z?"今天的计划都完成了。":"오늘 계획을 다 했어요.";
  }

  let primaryBtnHtml="";
  if(hasDraft){
    primaryBtnHtml=`<button type="button" class="btn-primary" data-testid="btn-primary" data-state="resume" onclick="startRound()">${z?"继续":"이어서"}</button>`;
  }else if(!isWorkDay){
    primaryBtnHtml=`<button type="button" class="btn-primary" data-testid="btn-primary" data-state="rest" disabled>${z?"完成这一轮":"이 라운드 완료"}</button><div class="btn-caption">${z?"今天是休息日。":"오늘은 쉬는 날이에요."}</div>`;
  }else if(rem<=0){
    primaryBtnHtml=`<button type="button" class="btn-primary" data-testid="btn-primary" data-state="done" disabled>${z?"完成这一轮":"이 라운드 완료"}</button><div class="btn-caption">${z?"今日计划轮次已全部完成。":"오늘 계획을 다 했어요."}</div>`;
  }else{
    primaryBtnHtml=`<button type="button" class="btn-primary" data-testid="btn-primary" data-state="round" onclick="startRound()">${z?"完成这一轮":"이 라운드 완료"}</button>`;
  }

  return`<div class="screen-wrap">
    ${renderTopBar(`<div class="date-line">${formatTodayDateLine(today2)}</div>`)}
    <div class="page-body">
      <div class="hero" data-testid="today-hero">
        <div class="hero-label">${z?"今日轮次":"오늘의 라운드"}</div>
        ${isWorkDay
          ?`<div class="hero-num" data-testid="hero-count">${done} / ${planned}</div>
            <div class="hero-sub">${pctR}% · ${z?`还剩${rem}轮`:`남은 ${rem}번`}</div>`
          :`<div class="hero-num rest-txt" data-testid="hero-count">${z?"今天是休息日":"오늘은 쉬는 날이에요"}</div>`}
        <div class="hero-plan">${planLine}</div>
      </div>

      ${s1Open?`<div class="notice-box" data-testid="s1-screen">
        <div class="notice-title bad">${z?"请立刻停下并坐下休息":"지금 멈추고 앉아서 쉬세요"}</div>
        <div class="notice-desc">${z?"如果胸痛、头晕或呼吸困难没有缓解，请立即拨打急救电话（中国 120 / 韩国 119）。爬楼已锁定。":"가슴 통증이나 어지러움이 안 가라앉으면 즉시 응급 전화(한국 119 / 중국 120)에 연락하세요. 계단 라운드가 잠겼어요."}</div>
        <button type="button" class="btn-text-inline" onclick="s1Open=false;render()">${z?"知道了":"확인"}</button>
      </div>`:""}

      ${restNotice?`<div class="notice-box" data-testid="rest-notice">
        <div class="notice-desc">${_coachMsgText("rest",coach)}</div>
        <button type="button" class="btn-text-inline" onclick="restNotice=false;render()">${z?"关闭":"닫기"}</button>
      </div>`:""}

      ${coach.stairsLocked?`<div class="notice-box">
        <div class="notice-desc">${planLine}</div>
        ${coach.lockReason==="body"?`<button type="button" class="btn-text-inline" data-testid="btn-unlock-body" onclick="doUnlockBody()">${z?"已经恢复，重新开始":"괜찮아졌어요, 다시 시작"}</button>`:""}
        ${canAskKnee?`<button type="button" class="btn-text-inline" data-testid="btn-unlock-knee" onclick="doUnlockKnee()">${z?"膝盖无痛，解除锁定":"무릎 통증 0이에요 (잠금 해제)"}</button>`:""}
      </div>`:""}

      ${(coach.needRetest||retestOpen)?`<div class="notice-box">
        <div class="notice-desc">${z?"超过14天未记录，重新测一下不喘气能爬几层：":"14일 이상 쉬었어요. 숨차기 전 몇 층까지 가능한지 다시 적어 주세요."}</div>
        <div class="inline-box">
          <input type="number" min="1" max="30" id="retest-input" class="input-field" style="flex:1" value="${fmtIn(retestVal)}" placeholder="${z?"层数":"층수"}" oninput="onRetestInput(this,false)" onchange="onRetestInput(this,true)">
          <button type="button" class="btn-inline" data-testid="btn-retest" onclick="doRetest()">${z?"重新自测":"재테스트"}</button>
        </div>
      </div>`:""}

      ${(coach.goalReached&&!coach.maintenance)?`<div class="notice-box">
        <div class="notice-desc">${z?"已达到目标体重，要切换到维持模式吗？":"목표 체중에 닿았어요. 유지 모드로 바꿀까요?"}</div>
        <button type="button" class="btn-text-inline" data-testid="btn-maintenance" onclick="doAcceptMaint()">${z?"切换到维持模式":"유지 모드로 바꾸기"}</button>
      </div>`:""}

      <div class="group">
        <div class="row">
          <span class="row-l">${z?"水":"물"}</span>
          <span class="row-v ${waterCups>0?"":"empty"}">${waterTxt}</span>
          <button type="button" class="row-plus" data-testid="row-water-add" onclick="addWater()">+</button>
        </div>
        <div class="row">
          <span class="row-l">${z?"体重":"체중"}</span>
          <span class="row-v ${hasWeight?"":"empty"}">${weightTxt}</span>
          <button type="button" class="row-plus" data-testid="row-weight-add" onclick="toggleWeightInput()">+</button>
        </div>
        ${weightInputOpen?`<div class="inline-box">
          <input type="number" step="0.1" id="wi" data-testid="input-weight" class="input-field key" style="flex:1" value="" placeholder="kg" oninput="onWeightInlineInput(this)" onchange="onWeightInlineInput(this)">
          <button type="button" class="btn-inline" data-testid="btn-weight-save" disabled onclick="saveW()">${t("save")}</button>
        </div>`:""}
        <div class="row">
          <span class="row-l">${z?"饮食":"식사"}</span>
          <span class="row-v ${mealInfo.empty?"empty":""}">${mealInfo.text}</span>
          <button type="button" class="row-plus" data-testid="row-meal-add" onclick="toggleMealPicker()">+</button>
        </div>
        ${mealPickerOpen?`<div class="chip-row">
          ${[["bf",z?"早餐":"아침"],["ln",z?"午餐":"점심"],["dn",z?"晚餐":"저녁"],["sn",z?"加餐":"간식"]].map(([k,lbl])=>`<button type="button" class="chip ${curMeals.includes(k)?"on":""}" data-testid="meal-${k}" onclick="toggleMealItem('${k}')">${lbl}</button>`).join("")}
        </div>`:""}
      </div>

      <p class="today-line" data-testid="today-line">${summaryTxt}</p>

      <div class="aux-block">
        <button type="button" class="btn-stop-text" data-testid="btn-stop" onclick="doBodyStop()">${z?"身体不舒服":"몸이 이상해요"}</button>
        <details class="stop-details" data-testid="stop-signs">
          <summary>${z?"运动停止信号与膝盖危险信号 (MedlinePlus, NHS)":"멈춤 신호 및 무릎 위험 신호 안내 (MedlinePlus, NHS)"}</summary>
          <div style="margin-top:6px">
            <div><b>${z?"全身停止信号":"몸 멈춤 신호"}:</b> ${z?"头晕、胸痛、心跳不规律、呼吸极度困难、恶心 → 立即停止并休息（不缓解请拨打 中国 120 / 韩国 119）":"어지러움, 가슴 통증, 불규칙한 심장 박동, 숨이 너무 참, 메스꺼움 → 즉시 멈추고 쉬기 (한국 119 / 중국 120)"}</div>
            <div style="margin-top:4px"><b>${z?"膝盖危险信号":"무릎 위험 신호"}:</b> ${z?"剧烈疼痛、无法活动或无法承重、明显肿胀或变形、卡住/打软腿/疼痛弹响、发热且膝盖红热 → 暂停爬楼并就医":"심하게 아픔, 움직이거나 체중을 못 실음, 많이 붓거나 모양이 변함, 잠기거나 꺾이거나 아픈 딸깍 소리, 열과 함께 붉고 뜨거움"}</div>
            <div style="margin-top:4px">${z?"来源：MedlinePlus, NHS":"출처: MedlinePlus, NHS"}</div>
          </div>
        </details>
      </div>
    </div>
    <div class="foot-dock">
      ${primaryBtnHtml}
    </div>
    ${renderTabBar("today")}
  </div>`;
}

function renderLog(){
  const z=lang==="zh";
  const wEntries=Object.entries(data).filter(([,v])=>typeof v.weight==="number"&&v.weight>0).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);
  const recentSessions=Array.isArray(sessions)?sessions.slice().reverse().slice(0,14):[];
  const revNotes=Array.isArray(notes)?notes.slice().reverse():[];
  const talkLbl=z?{3:"能哼歌",5.5:"能说话",7.5:"几个字",9:"说不出话"}:{3:"노래 가능",5.5:"말은 됨",7.5:"몇 마디만",9:"말 못 함"};
  const painLbl=z?{0:"膝盖正常",1:"稍微不适",2:"很痛"}:{0:"무릎 괜찮음",1:"조금 불편",2:"많이 아픔"};

  return`<div class="screen-wrap">
    ${renderTopBar()}
    <div class="page-body">
      <div class="page-title">${z?"记录":"기록"}</div>

      <div class="section-h">${z?"最近体重":"최근 체중 기록"}</div>
      ${wEntries.length
        ?wEntries.map(([d,v])=>`<div class="row"><span class="row-l">${d}</span><span class="row-v">${v.weight}kg</span></div>`).join("")
        :`<div class="empty-line">${z?"暂无记录":"아직 없음"}</div>`}

      <div class="section-h">${z?"体重趋势":"체중 추이"}</div>
      ${buildChart()}

      <div class="section-h">${z?"最近训练":"최근 세션"}</div>
      ${recentSessions.length
        ?recentSessions.map(s=>{
          const tk=s.talk!==null&&s.talk!==undefined?(talkLbl[s.talk]||""):"";
          const pn=painLbl[Number(s.pain)||0]||"";
          const meta=[`${Number(s.doneRounds)||0}/${Number(s.plannedRounds)||0}`,tk,pn].filter(Boolean).join(" · ");
          return`<div class="row"><span class="row-l">${s.d}</span><span class="row-v">${meta}</span></div>`;
        }).join("")
        :`<div class="empty-line">${z?"暂无记录":"아직 없음"}</div>`}

      <div class="section-h">${z?"教练笔记":"지난 코치 노트"}</div>
      <div data-testid="notes-list">
        ${revNotes.length
          ?revNotes.map(n=>{
            const visR=(Array.isArray(n.rules)?n.rules:[]).filter(r=>r&&r!=="W2");
            const rStr=visR.length?` <span class="rule-tag">[${visR.join(", ")}]</span>`:"";
            const lns=Array.isArray(n.lines)?n.lines:[];
            return`<div style="padding:10px 0">
              <div class="hero-label">${n.wk||""}${rStr}</div>
              ${lns.map(l=>`<p class="note-p" style="margin-top:4px">${l}</p>`).join("")}
            </div>`;
          }).join("")
          :`<div class="empty-line">${z?"暂无记录":"아직 없음"}</div>`}
      </div>
    </div>
    ${renderTabBar("log")}
  </div>`;
}

function renderSettings(){
  const z=lang==="zh";
  if(!coach)coach=loadCoach(cfg);
  const calInfo=calcCaloriePlan(cfg);
  const kt=kcalTarget(cfg,coach,coach.lastAvgW);
  const goalMap=z?{loss:"减轻体重",gain:"增加体重",maintain:"保持目前体重"}:{loss:"체중 줄이기",gain:"체중 늘리기",maintain:"지금 체중 유지"};
  const goalTxt=coach.maintenance?(z?"保持目前体重 (维持模式)":"지금 체중 유지 (유지 모드)"):(goalMap[cfg.goal]||goalMap.loss);

  return`<div class="screen-wrap">
    ${renderTopBar()}
    <div class="page-body">
      <div class="page-title">${z?"设置":"설정"}</div>
      <div class="group" style="margin-top:16px">
        <div class="row"><span class="row-l">${z?"目标":"목표"}</span><span class="row-v">${goalTxt} · ${cfg.startWeight}kg → ${cfg.targetWeight}kg</span></div>
        <div class="row"><span class="row-l">${z?"挑战周期":"기간"}</span><span class="row-v" data-testid="info-dates">${cfg.startDate} ~ ${cfg.endDate}</span></div>
        <div class="row"><span class="row-l">BMR · TDEE</span><span class="row-v">${calInfo.bmrRound.toLocaleString()} · ${kt.tdee.toLocaleString()} kcal</span></div>
        <div class="row"><span class="row-l">${z?"建议每日热量":"권장 칼로리"}</span><span class="row-v">${kt.min.toLocaleString()}~${kt.max.toLocaleString()} kcal</span></div>
        <div class="row"><span class="row-l">${z?"语言":"언어"}</span><button type="button" class="btn-text-inline" onclick="toggleLang()">${z?"한국어":"简体中文"}</button></div>
      </div>

      <div class="section-h">${z?"主题":"테마"}</div>
      <div class="choice-grid" style="margin-top:4px">
        <button type="button" class="choice-sm ${themePref==="light"?"on":""}" data-testid="theme-light" onclick="setTheme('light')">${z?"浅色":"라이트"}</button>
        <button type="button" class="choice-sm ${themePref==="dark"?"on":""}" data-testid="theme-dark" onclick="setTheme('dark')">${z?"深色":"다크"}</button>
        <button type="button" class="choice-sm ${themePref==="auto"?"on":""}" data-testid="theme-auto" onclick="setTheme('auto')">${z?"跟随系统":"자동"}</button>
      </div>

      ${renderCoachSettings()}

      <div class="group" style="margin-top:24px">
        <button type="button" class="btn-text" data-testid="btn-coach-settings" onclick="openCoachSettings()">${z?"教练设置":"코치 설정"}</button>
        <button type="button" class="btn-text" data-testid="btn-export" onclick="exportBackup()">${t("exportBtn")}</button>
        <button type="button" class="btn-text" data-testid="btn-import" onclick="triggerImport()">${t("importBtn")}</button>
        <input type="file" id="import-file-input" data-testid="import-file" accept=".json,application/json" style="display:none" onchange="handleImportFile(event)">
        <button type="button" class="btn-text" data-testid="btn-end" onclick="endC()">${t("end")}</button>
        <button type="button" class="btn-text bad" data-testid="btn-reset" onclick="resetAll()">${t("reset")}</button>
      </div>

      <p class="disclaimer" data-testid="disclaimer-footer">${t("disclaimer")}</p>
    </div>
    ${renderTabBar("settings")}
  </div>`;
}

// ═══ RENDER ═══
// keep the last row above the fixed bottom dock (its height varies: 1-2 buttons, notices)
function fitDock(){
  const w=document.querySelector("#app .screen-wrap"),d=document.querySelector("#app .foot-dock");
  if(!w)return;
  const tab=d&&!d.classList.contains("no-tabs")?56:0;
  w.style.paddingBottom=d?(d.getBoundingClientRect().height+tab+16)+"px":"";
}
function render(){_renderScreen();fitDock();if(_toastBlocked())hideToast()}
function _renderScreen(){
  syncFromStorage();
  applyTheme();
  const app=document.getElementById("app");
  if(!cfg){app.innerHTML=renderOnboarding();return}
  const today2=td();
  if(!coach){coach=loadCoach(cfg);saveCoach(coach)}
  if(coach.lastDaily!==today2){
    const dc=dailyCheck({coach,cfg,sessions},today2);
    coach=dc.coach;
    coach.lastDaily=today2;
    coach.dailyRules=dc.rules;
    coach.askUnlock=dc.askUnlock;
    saveCoach(coach);
  }
  if(checkinDue(coach,today2)){
    const wc=weeklyCheckin({coach,cfg,data,sessions,learn},today2);
    coach=wc.coach;
    cfg=wc.cfg;
    coach.unreadNote=wc.note;
    saveCoach(coach);
    saveC(cfg);
    notes.push(wc.note);
    saveNotes(notes);
  }
  if(curView==="quest")curView="today";
  if(curView==="weight"||curView==="history")curView="log";
  if(curView==="stats")curView="settings";
  if(sessionOpen){
    app.innerHTML=renderSessionSheet();
    return;
  }
  if(curView==="today"&&coach.unreadNote){
    app.innerHTML=renderWeekly();
    return;
  }
  if(curView==="log"){
    app.innerHTML=renderLog();
    return;
  }
  if(curView==="settings"){
    app.innerHTML=renderSettings();
    return;
  }
  app.innerHTML=renderToday(today2);
}

function _buildInitialCoach(cfgObj,isHook,customPlan){
  const c=defaultCoach(cfgObj);
  if(isHook){
    if(customPlan&&customPlan.coach&&typeof customPlan.coach==="object"){
      const pc=customPlan.coach;
      if(Array.isArray(pc.places))c.places=cloneObj(pc.places);
      if(pc.activePlace!==undefined)c.activePlace=pc.activePlace;
      if(pc.joints&&typeof pc.joints==="object")c.joints=Object.assign({},c.joints,pc.joints);
      if(pc.fitness&&typeof pc.fitness==="object")c.fitness=Object.assign({},c.fitness,pc.fitness);
      if(Array.isArray(pc.slots)&&pc.slots.length)c.slots=cloneObj(pc.slots);
      if(Array.isArray(pc.days)&&pc.days.length)c.days=pc.days.slice();
      if(Array.isArray(pc.equip))c.equip=pc.equip.slice();
      if(pc.level)c.level=pc.level;
      if(pc.checkinDow!==undefined)c.checkinDow=pc.checkinDow;
      if(c.level==="hard"&&!hardAllowed(c,cfgObj))c.level="normal";
      c.plan=pc.plan?cloneObj(pc.plan):initialPlan(c,cfgObj);
    }
    return c;
  }
  const topF=parseInt(ob.obTopFloor,10)||parseInt(ob.obFloors,10)||0;
  const totF=parseInt(ob.obFloors,10)||topF||0;
  const stF=parseInt(ob.obStartFloor,10)||1;
  if(topF>0){
    c.places=[{name:ob.obPlaceName||"home",floorsTotal:totF,startFloor:stF,topFloor:topF,elevator:ob.obElev||"no",handrail:Boolean(ob.obHandrail)}];
  }
  c.joints.knee=_effObKnee();
  if(ob.obQuick)c.fitness.quick=ob.obQuick;
  c.slots=[{name:ob.obSlot||"evening",min:Number(ob.obMin)||5}];
  c.level=ob.obLevel||"easy";
  if(c.level==="hard"&&!hardAllowed(c,cfgObj))c.level="normal";
  c.plan=initialPlan(c,cfgObj);
  return c;
}

function startC(customPlan){
  syncObInputs();
  const isHook=!!(customPlan&&typeof customPlan==="object");
  const p=isHook?customPlan:ob;
  const rawSw=(isHook&&"startWeight" in customPlan)?customPlan.startWeight:p.startWeight;
  const rawHt=(isHook&&"height" in customPlan)?customPlan.height:p.height;
  const rawAge=(isHook&&"age" in customPlan)?customPlan.age:p.age;
  const rawDays=(isHook&&("totalDays" in customPlan||"days" in customPlan))?(customPlan.totalDays!==undefined?customPlan.totalDays:customPlan.days):(p.totalDays!==undefined?p.totalDays:(p.days!==undefined?p.days:ob.days));
  const sex=(isHook&&"sex" in customPlan)?customPlan.sex:p.sex;
  const sw=(rawSw===""||rawSw===null||rawSw===undefined)?NaN:parseFloat(rawSw);
  const ht=(rawHt===""||rawHt===null||rawHt===undefined)?NaN:parseFloat(rawHt);
  const age=(rawAge===""||rawAge===null||rawAge===undefined)?NaN:parseInt(rawAge,10);
  const days=(rawDays===""||rawDays===null||rawDays===undefined)?NaN:parseInt(rawDays,10);
  const goal=p.goal||ob.goal||"loss";
  const rawTw=(isHook&&"targetWeight" in customPlan)?customPlan.targetWeight:p.targetWeight;
  const tw=goal==="maintain"?sw:((rawTw===""||rawTw===null||rawTw===undefined)?NaN:parseFloat(rawTw));
  const hookExplicitAgeSex=isHook&&("age" in customPlan)&&("sex" in customPlan);
  const med=isHook?(("med" in customPlan)?customPlan.med:(ob.med||(hookExplicitAgeSex?"none":""))):ob.med;
  const ed=isHook?(("ed" in customPlan)?customPlan.ed:(ob.ed||(hookExplicitAgeSex?"none":""))):ob.ed;
  const preg=isHook?(("preg" in customPlan)?customPlan.preg:(ob.preg||(hookExplicitAgeSex?"no":""))):ob.preg;
  const fullPlan=Object.assign({},ob,p,{goal,sex,startWeight:sw,targetWeight:tw,height:ht,age,totalDays:days,days,med,ed,preg});
  const check=canStart(fullPlan);
  if(!check.ok){
    toast(check.reason);
    return check;
  }
  const startDate=p.startDate||td();
  const endDate=addD(startDate,days-1);
  const cal=calcCaloriePlan(fullPlan);
  cfg={
    schemaVersion:3,
    goal,
    muscle:!!fullPlan.muscle,
    sex:fullPlan.sex,
    age,
    height:ht,
    startWeight:sw,
    targetWeight:tw,
    totalDays:days,
    startDate,
    endDate,
    med:fullPlan.med,
    medAck:!!fullPlan.medAck,
    pains:Array.isArray(fullPlan.pains)?fullPlan.pains:["none"],
    preg:fullPlan.preg,
    ed:fullPlan.ed,
    workType:fullPlan.workType||"standing",
    pal:resolvePal(fullPlan.pal||fullPlan.workType),
    mealType:fullPlan.mealType||"out",
    allergy:fullPlan.allergy||"none",
    allergyMemo:fullPlan.allergyMemo||"",
    exTime:fullPlan.exTime||"10",
    exPlace:fullPlan.exPlace||"",
    preset:goal==="loss"?(fullPlan.preset||"flex"):goal,
    bmr:cal.bmrRound,
    tdee:cal.tdeeRound,
    recCalMin:cal.recMin,
    recCalMax:cal.recMax
  };
  saveC(cfg);
  coach=_buildInitialCoach(cfg,isHook,customPlan);
  saveCoach(coach);
  saveSessions([]);
  saveLearn(defaultLearn());
  saveNotes([]);
  sessionOpen=false;restNotice=false;s1Open=false;settingsOpen=false;retestOpen=false;weightInputOpen=false;mealPickerOpen=false;lastCoachMsg="";
  data={};
  data[startDate]={weight:sw};
  saveD(data);
  usr={xp:0};
  saveU(usr);
  curView="today";
  toast(lang==="zh"?"已保存到本机":"이 기기에 저장했어요");
  render();
  return{ok:true,cfg,coach};
}
function saveW(){
  const el=document.getElementById("wi");
  const v=el?parseFloat(el.value):NaN;
  if(!Number.isNaN(v)&&v>=30&&v<=300){
    weightInputOpen=false;
    sdf(td(),"weight",v);
  }else{
    toast(lang==="zh"?"请输入有效体重":"유효한 체중을 입력해 주세요");
  }
}
function _clearAllState(){
  [CK,DK,UK,COK,SEK,LEK,NOK].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  cfg=null;data={};usr={xp:0};coach=null;sessions=[];learn=defaultLearn();notes=[];
  sessionOpen=false;restNotice=false;s1Open=false;settingsOpen=false;retestOpen=false;weightInputOpen=false;mealPickerOpen=false;lastCoachMsg="";
  ob=defaultOb();obStep=1;curView="today";
}
function endC(skipConfirm){if(skipConfirm||confirm(lang==="zh"?"确定结束？":"종료할까요?")){_clearAllState();render()}}
function resetAll(skipConfirm){if(skipConfirm||confirm(lang==="zh"?"清除所有？不可恢复":"전체 삭제? 복구 불가")){_clearAllState();render()}}

    hardAllowed,
    ladderUp,
    ladderDown,
    canMove,

    adherence,
    applySession,
    unlock,
    dailyCheck,
    weeklyCheckin,
    avgWeight,
    kcalTarget,
    checkinDue,
    acceptMaintenance
  }
};
render();
