<!DOCTYPE html>
<!-- burn60 v2 - single-file offline health challenge app (Mifflin-St Jeor direct implementation) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="버닝 챌린지">
<title>🔥 버닝 챌린지</title>
<style>
:root{--cy:#00fff2;--mg:#ff00ff;--ny:#f0ff00;--np:#ff2d7b;--eb:#0080ff;--nv:#bf00ff;--bg:#06060e;--glass:rgba(255,255,255,0.04);--glass2:rgba(255,255,255,0.07);--gborder:rgba(255,255,255,0.08);--gborder2:rgba(255,255,255,0.12);--dim:#556;--txt:#d8dce8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;max-width:420px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;overflow-x:hidden;background-image:radial-gradient(ellipse at 20% 50%,rgba(0,255,242,.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(255,0,255,.03) 0%,transparent 50%)}
/* glass card */
.gc{background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--gborder);box-shadow:0 0 20px rgba(0,0,0,.3)}
.gc2{background:var(--glass2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--gborder2)}
/* neon glow */
.glow-cy{text-shadow:0 0 8px rgba(0,255,242,.5)}
.glow-mg{text-shadow:0 0 8px rgba(255,0,255,.5)}
.glow-ny{text-shadow:0 0 8px rgba(240,255,0,.5)}
.glow-np{text-shadow:0 0 8px rgba(255,45,123,.5)}
.glow-eb{text-shadow:0 0 8px rgba(0,128,255,.5)}
.glow-nv{text-shadow:0 0 8px rgba(191,0,255,.5)}
/* setup */
.setup{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
.setup-logo{text-align:center;font-size:48px;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(0,255,242,.4))}
.setup-title{text-align:center;font-size:28px;font-weight:800;color:var(--cy);margin-bottom:4px;text-shadow:0 0 20px rgba(0,255,242,.4)}
.setup-sub{text-align:center;font-size:13px;color:var(--dim);margin-bottom:32px}
.sf{margin-bottom:18px}
.sl{font-size:11px;color:#889;font-weight:600;margin-bottom:5px;display:block}
.si{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--gborder2);border-radius:12px;padding:13px 16px;color:#fff;font-size:17px;font-weight:700;outline:none;font-family:monospace;text-align:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.si:focus{border-color:var(--cy);box-shadow:0 0 12px rgba(0,255,242,.2)}
.si::placeholder{color:#334;font-weight:400}
.sr{display:flex;gap:10px}.sr .sf{flex:1}
.su{font-size:10px;color:#556;text-align:center;margin-top:3px}
.sbtn{width:100%;padding:16px;border:none;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer;margin-top:12px;background:linear-gradient(135deg,var(--cy),var(--eb));color:#000;box-shadow:0 0 30px rgba(0,255,242,.3);transition:transform .1s}
.sbtn:active{transform:scale(.96)}
.shint{text-align:center;font-size:10px;color:#445;margin-top:16px;line-height:1.6}
/* header */
.hdr{padding:14px 16px 2px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:17px;font-weight:800;color:var(--cy);text-shadow:0 0 15px rgba(0,255,242,.4)}
.hdr-r{display:flex;gap:6px;align-items:center}
.lang-btn{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--gborder);border-radius:8px;padding:4px 8px;color:#889;font-size:9px;font-weight:600;cursor:pointer}
.lvl-b{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(240,255,0,.2);border-radius:8px;padding:4px 10px;font-size:10px;font-weight:700;color:var(--ny);text-shadow:0 0 8px rgba(240,255,0,.3)}
.hdr-sub{font-size:9px;color:#556;padding:0 16px 4px;font-weight:500}
/* bottom nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:rgba(6,6,14,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--gborder);padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:100}
.bnav button{flex:1;border:none;background:none;color:#445;font-size:9px;font-weight:600;cursor:pointer;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .2s}
.bnav button.act{color:var(--cy)}
.bnav .ni{font-size:18px}
.ct{padding:0 14px}
.ct2{font-size:13px;font-weight:700;margin-bottom:8px;color:#aab}
.cr{display:flex;justify-content:space-between;align-items:center}
.dm{font-size:10px;color:var(--dim);margin-top:2px;font-weight:500}
/* quest items */
.qt{font-size:9px;font-weight:700;color:#445;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
.qt .ql{flex:1;height:1px;background:rgba(255,255,255,.05)}
.qi{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--gborder);border-radius:12px;margin-bottom:5px;cursor:pointer;transition:all .15s}
.qi:active{transform:scale(.98)}
.qi.dn{border-color:rgba(0,255,242,.15);background:rgba(0,255,242,.03)}
.qi.dn .qc{background:var(--cy);border-color:var(--cy);color:#000;box-shadow:0 0 10px rgba(0,255,242,.3)}
.qc{width:26px;height:26px;border-radius:7px;border:2px solid #334;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;transition:all .2s}
.qct{flex:1}.qct .t{font-size:12px;font-weight:600}.qct .d{font-size:10px;color:var(--dim);margin-top:1px}
.qe{font-size:20px;flex-shrink:0}
/* ring */
.ds{display:flex;align-items:center;gap:14px;padding:2px 0}
.rw{position:relative;width:66px;height:66px;flex-shrink:0}
.rtx{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.rn{font-size:16px;font-weight:800;color:#fff;font-family:monospace}
.rl{font-size:8px;color:var(--dim)}
.dst{flex:1}.dsr{display:flex;justify-content:space-between;padding:2px 0;font-size:11px}
.dsl{color:#778}.dsv{font-weight:700;font-family:monospace}
/* xp */
.xpbar{background:rgba(255,255,255,.06);border-radius:4px;height:5px;margin-top:5px;overflow:hidden}
.xpfill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ny),var(--mg));transition:width .5s;box-shadow:0 0 6px rgba(240,255,0,.3)}
.xplbl{font-size:8px;color:#556;margin-top:2px;text-align:right}
/* menu */
.mc{margin-bottom:4px}
.mct{font-size:11px;font-weight:700;padding:6px 0 3px;color:#889;cursor:pointer;display:flex;justify-content:space-between}
.mct:after{content:"▾";font-size:9px;color:#445}
.mc.op .mct:after{content:"▴"}
.ml{display:none;padding:0 0 2px}.mc.op .ml{display:block}
.mi{font-size:10px;color:#778;padding:3px 10px;line-height:1.6}
.mn{font-size:8px;color:#556}
/* weight */
.bn{font-size:32px;font-weight:800;color:#fff;font-family:monospace;line-height:1}
.sb{text-align:center;flex:1}
.sn{font-size:17px;font-weight:800;color:#fff;font-family:monospace}
.pb{background:rgba(255,255,255,.06);border-radius:5px;height:6px;margin-top:10px;overflow:hidden}
.pf{height:100%;border-radius:5px;transition:width .5s;background:linear-gradient(90deg,var(--cy),var(--eb));box-shadow:0 0 8px rgba(0,255,242,.2)}
.plb{font-size:9px;color:var(--dim);margin-top:4px;text-align:center}
.ir{display:flex;gap:8px;margin-top:8px}
.ir input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--gborder2);border-radius:10px;padding:11px 12px;color:#fff;font-size:15px;font-weight:600;outline:none;font-family:monospace;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.svb{background:linear-gradient(135deg,var(--cy),var(--eb));border:none;border-radius:10px;padding:11px 18px;color:#000;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 0 12px rgba(0,255,242,.2)}
.svh{font-size:10px;color:var(--cy);margin-top:5px;font-weight:500}
.csv{width:100%;max-width:380px;display:block;margin:0 auto}
.ech{text-align:center;color:#445;font-size:11px;padding:20px 0}
/* info row */
.info-r{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.info-r:last-child{border:none}
.info-l{font-size:11px;color:#667}.info-v{font-size:11px;font-weight:700;font-family:monospace}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px}
.cal-h{font-size:8px;color:#556;text-align:center;font-weight:600;padding:2px 0}
.cal-d{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:#334;background:rgba(255,255,255,.02)}
.cal-d.c1{background:rgba(0,255,242,.12);color:var(--cy);box-shadow:inset 0 0 6px rgba(0,255,242,.1)}
.cal-d.c2{background:rgba(240,255,0,.1);color:var(--ny)}
.cal-d.c3{background:rgba(255,45,123,.1);color:var(--np)}
.cal-d.c4{background:rgba(255,255,255,.02);color:#445}
.cal-d.cs{background:rgba(191,0,255,.08);color:var(--nv)}
/* history */
.hl{max-height:350px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hi{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px}
.hd{font-weight:600}.hdy{font-size:9px;color:var(--dim);margin-left:4px;font-family:monospace}
.hic{display:flex;gap:7px;align-items:center}
.hw{font-weight:700;color:var(--cy);font-family:monospace;min-width:44px;text-align:right}
.hn{color:#334;min-width:44px;text-align:right}
.hp{font-weight:700;font-family:monospace;min-width:32px;text-align:right}
/* badges */
.bdg{display:inline-flex;align-items:center;gap:4px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(240,255,0,.15);border-radius:8px;padding:4px 8px;font-size:9px;font-weight:600;color:var(--ny);margin:2px}
.bdg.locked{opacity:.2;filter:grayscale(1);border-color:var(--gborder)}
.bdg-next{font-size:10px;color:#778;padding:8px 0;border-top:1px solid rgba(255,255,255,.04);margin-top:8px}
/* rest day */
.rest{text-align:center;padding:50px 20px}
.rest .re{font-size:56px;margin-bottom:12px;filter:drop-shadow(0 0 20px rgba(191,0,255,.3))}
.rest .rt{font-size:18px;font-weight:800;color:var(--nv);text-shadow:0 0 15px rgba(191,0,255,.4)}
.rest .rs{font-size:12px;color:#556;line-height:1.8;margin-top:8px}
/* toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--glass2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(0,255,242,.2);color:var(--cy);padding:6px 18px;border-radius:18px;font-size:12px;z-index:999;font-weight:600;box-shadow:0 0 20px rgba(0,255,242,.15);transition:opacity .3s;pointer-events:none}
.toast.hide{opacity:0}
.rbtn{width:100%;padding:10px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,45,123,.15);border-radius:10px;color:var(--np);font-size:11px;font-weight:500;cursor:pointer;margin-top:4px;margin-bottom:10px}
.ebtn{width:100%;padding:10px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(0,255,242,.1);border-radius:10px;color:var(--cy);font-size:11px;cursor:pointer;margin-bottom:5px;opacity:.6}
.streak-b{display:inline-flex;align-items:center;gap:3px;background:rgba(240,255,0,.08);border:1px solid rgba(240,255,0,.2);border-radius:7px;padding:3px 8px;font-size:10px;font-weight:700;color:var(--ny);text-shadow:0 0 6px rgba(240,255,0,.3)}
/* overlay */
.ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(6,6,14,.92);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* animations */
.anim-char{font-size:64px;animation:bounce 0.6s ease infinite alternate;filter:drop-shadow(0 0 30px rgba(0,255,242,.5))}
@keyframes bounce{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-20px) scale(1.1)}}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes slideIn{0%{transform:translateX(-100vw)}50%{transform:translateX(10px)}100%{transform:translateX(0)}}
@keyframes disco{0%{transform:rotate(-10deg) scale(1)}25%{transform:rotate(10deg) scale(1.1)}50%{transform:rotate(-10deg) scale(1)}75%{transform:rotate(10deg) scale(1.1)}100%{transform:rotate(-10deg) scale(1)}}
@keyframes drop{0%{transform:translateY(-100vh) rotate(0)}60%{transform:translateY(0) rotate(360deg)}80%{transform:translateY(-30px)}100%{transform:translateY(0)}}
@keyframes fireSpin{0%{transform:rotate(0) scale(.5);opacity:0}50%{transform:rotate(180deg) scale(1.3);opacity:1}100%{transform:rotate(360deg) scale(1);opacity:1}}
@keyframes flyBy{0%{transform:translateX(-100vw) translateY(0)}50%{transform:translateX(0) translateY(-30px)}100%{transform:translateX(100vw) translateY(0)}}
.anim-msg{font-size:22px;font-weight:800;margin-top:12px;background:linear-gradient(90deg,var(--cy),var(--mg),var(--ny));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sparkle{position:absolute;font-size:20px;animation:sparkle 1s ease-out forwards}
@keyframes sparkle{0%{opacity:1;transform:scale(0)}50%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(0) translateY(-40px)}}
.game-canvas{border-radius:12px;background:rgba(0,0,0,.4);touch-action:none}
.game-hud{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;font-weight:700}
.game-lives{color:var(--np)}.game-score{color:var(--cy)}
.game-over-msg{font-size:13px;color:#778;text-align:center;margin-top:12px;font-style:italic;line-height:1.6}
.game-btn{background:linear-gradient(135deg,var(--cy),var(--eb));border:none;border-radius:12px;padding:14px 32px;color:#000;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px;box-shadow:0 0 25px rgba(0,255,242,.3)}
.game-btn:active{transform:scale(.95)}
/* weekly report */
.wr-box{text-align:center;padding:8px 0}
.wr-grade{font-size:36px;font-weight:800}
.wr-label{font-size:11px;color:#667;margin-top:2px}
/* v2 onboarding & disclaimer & backup */
.disc{font-size:10px;color:#778;line-height:1.5;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--gborder);margin-top:12px;text-align:left}
.ob-step{font-size:11px;color:var(--cy);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.ob-q{font-size:14px;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.4}
.ob-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ob-opt{flex:1 1 calc(50% - 6px);min-width:90px;padding:10px 8px;border-radius:10px;border:1px solid var(--gborder2);background:rgba(255,255,255,.04);color:var(--txt);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.ob-opt.on{border-color:var(--cy);background:rgba(0,255,242,.14);color:var(--cy);box-shadow:0 0 10px rgba(0,255,242,.2)}
.ob-nav{display:flex;gap:8px;margin-top:10px}
.ob-btn2{flex:1;padding:12px;border-radius:12px;border:1px solid var(--gborder2);background:var(--glass2);color:var(--txt);font-size:13px;font-weight:700;cursor:pointer}
.ob-warn{padding:10px 12px;border-radius:10px;background:rgba(240,255,0,.08);border:1px solid rgba(240,255,0,.3);color:var(--ny);font-size:11px;line-height:1.5;margin-bottom:10px}
.ob-stop{padding:12px;border-radius:10px;background:rgba(255,45,123,.12);border:1px solid rgba(255,45,123,.4);color:var(--np);font-size:12px;font-weight:700;line-height:1.5;margin-bottom:10px}
.tdee-box{padding:10px 12px;border-radius:10px;background:rgba(0,255,242,.05);border:1px solid rgba(0,255,242,.2);font-size:11px;line-height:1.6;margin-bottom:10px}
/* v3 adaptive coach */
.cc-card{background:linear-gradient(135deg,rgba(0,255,242,.07),rgba(0,128,255,.05));border:1px solid rgba(0,255,242,.25);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 0 20px rgba(0,255,242,.08)}
.cc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cc-ttl{font-size:13px;font-weight:800;color:var(--cy)}
.cc-prog{font-size:11px;font-weight:700;color:var(--ny);font-family:monospace}
.cc-desc{font-size:12px;color:#eef;line-height:1.5;margin-bottom:8px}
.cc-msg{font-size:11px;color:var(--ny);background:rgba(240,255,0,.08);border:1px solid rgba(240,255,0,.25);border-radius:10px;padding:8px 10px;margin-bottom:8px;line-height:1.4}
.cc-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cc-btn{flex:1 1 calc(50% - 6px);padding:10px 8px;border-radius:10px;border:1px solid var(--gborder2);background:var(--glass2);color:#fff;font-size:11px;font-weight:700;cursor:pointer;text-align:center}
.cc-btn.pri{background:linear-gradient(135deg,var(--cy),var(--eb));color:#000;border:none;font-weight:800}
.cc-btn.warn{border-color:rgba(255,45,123,.4);color:var(--np);background:rgba(255,45,123,.08)}
.cc-stop{margin-top:8px;font-size:10px;color:#99a;background:rgba(255,255,255,.03);border:1px solid var(--gborder);border-radius:10px;padding:8px 10px;line-height:1.5}
.cc-stop summary{cursor:pointer;font-weight:700;color:#bbc;outline:none}
.cc-sheet{background:rgba(12,12,24,.97);border:1px solid rgba(0,255,242,.3);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 0 30px rgba(0,0,0,.6)}
.cc-sttl{font-size:12px;font-weight:700;color:var(--cy);margin:8px 0 6px}
.note-card{background:rgba(240,255,0,.06);border:1px solid rgba(240,255,0,.3);border-radius:14px;padding:12px;margin-bottom:10px;font-size:11px;line-height:1.6}
</style>
</head>
<body>
<div id="toast" class="toast hide"></div>
<div id="app"></div>
<div id="overlay" class="ov" style="display:none"></div>
<script>
const DISC_KO="이 앱은 병원 진단·치료를 대신하지 않습니다. 질환, 임신, 부상, 섭식 문제가 있으면 사용을 멈추고 의사와 상담하세요. 식단과 운동의 책임은 본인에게 있습니다.";

  const painCnt=inWin.filter(x=>Number(x.pain)>=1||x.redFlag).length;
  let l1=z?`上周：计划 ${a.planned}轮中完成 ${a.done}轮`:`지난주: 계획 ${a.planned}라운드 중 ${a.done}라운드`;

  if(wNow.n>=4){

    if(w14.n>0)l1+=` (${kgTxt(wNow.avg-w14.avg)})`;
  }
  const nB=startPlan.N,nA=c.plan.N;
  let l2=nB===nA?(z?`本周：每天 ${nA}轮，保持不变`:`이번 주: 하루 ${nA}번 그대로`):(z?`本周：每天 ${nB}轮 → ${nA}轮 (${nA>nB?"+":"−"}${Math.abs(nA-nB)})`:`이번 주: 하루 ${nB}번 → ${nA}번 (${nA>nB?"+":"−"}${Math.abs(nA-nB)})`);
  const kDelta=(Number(c.kcalAdj)||0)-startAdj;
  if(kDelta!==0)l2+=z?` · 建议热量 ${kDelta>0?"+":"−"}${Math.abs(kDelta)}kcal`:` · 권장 칼로리 ${kDelta>0?"+":"−"}${Math.abs(kDelta)}kcal`;
  else if(startPlan.R!==c.plan.R||startPlan.pace!==c.plan.pace)l2+=z?" · 强度有调整":" · 강도 조정";
  const REASON={
    M2:["실행이 절반이 안 돼서, 더 작게 다시 시작해요","完成不到一半，先从更小的量重新开始"],
    W1:["꾸준함 먼저예요. 칼로리는 그대로 두고 횟수를 줄였어요","先保证坚持。热量不变，先减少轮数"],
    W4:["2주 연속 1주에 1kg 넘게 빠졌어요. 조금 더 먹어요","连续两周每周减重超过1kg，适当多吃一点"],
    W3:["실행은 충분한데 체중이 2주째 그대로예요","执行得很好，但体重两周没有变化"],
    W5:["실행은 충분한데 체중이 2주째 그대로예요","执行得很好，但体重两周没有变化"],
    G1:["목표 체중에 닿았어요. 유지 모드를 골라 보세요","已达到目标体重，可以切换到维持模式"],
    G2:["유지 범위를 2주 연속 벗어났어요","连续两周超出维持范围"],
    "W-skip":["체중을 이번 주 4번 기록하면 체중 기반 조정을 해요","本周记录4次体重后，将按体重调整"]
  };
  const order=["M2","W1","W4","W3","W5","G1","G2","W-skip"];
  const top=order.find(k=>rules.includes(k));
  const rTxt=top?REASON[top][z?1:0]:(z?"按计划进行中":"계획대로 가고 있어요");
  const l3=(z?"原因：":"이유: ")+rTxt;
  const status=pctN===null?"none":pctN>=70?"good":pctN>=50?"short":"low";
  const note={wk:today,lines:[l1,l2,l3],rules:rules.slice(),changes:changes.slice(),rate:a.rate,done:a.done,planned:a.planned,status};
  return{coach:c,cfg:cf,note,rules,changes};
}

const PAL_MAP={sedentary:1.2,light:1.375,standing:1.55,moderate:1.55,labor:1.725,active:1.725};
function resolvePal(palOrWork){
  if(typeof palOrWork==="number"&&palOrWork>0)return palOrWork;
  return PAL_MAP[palOrWork]||1.55;
}
function calcBMR(sex,kg,cm,age){
  const w=Number(kg)||0,h=Number(cm)||0,a=Number(age)||0;
  const base=10*w+6.25*h-5*a;
  return(sex==="f"||sex==="female")?base-161:base+5;
}
function calcTDEE(sex,kg,cm,age,pal){
  return calcBMR(sex,kg,cm,age)*resolvePal(pal);
}
function calcWeeklyRate(start,target,days){
  const d=Number(days)||0;
  if(d<=0)return 0;
  return((Number(start)-Number(target))/(d/7));
}
function calcCaloriePlan(plan){
  const sex=plan.sex||"m";
  const bmr=calcBMR(sex,plan.startWeight,plan.height,plan.age);
  const pal=resolvePal(plan.pal||plan.workType);
  const tdee=bmr*pal;
  const floor=(sex==="f"||sex==="female")?1200:1500;
  const goal=plan.goal||"loss";
  let recMin=Math.round(tdee),recMax=Math.round(tdee),recTarget=Math.round(tdee),clamped=false;
  if(goal==="loss"){
    const rawMin=Math.round(tdee-500),rawMax=Math.round(tdee-300),rawT=Math.round(tdee-400);
    if(rawMin<floor||rawT<floor){clamped=true}
    recMin=Math.max(floor,rawMin);
    recMax=Math.max(floor,rawMax);
    recTarget=Math.max(floor,rawT);
  }else if(goal==="gain"){
    recMin=Math.round(tdee+300);
    recMax=Math.round(tdee+500);
    recTarget=Math.round(tdee+400);
  }
  return{bmr,tdee,bmrRound:Math.round(bmr),tdeeRound:Math.round(tdee),floor,recMin,recMax,recTarget,clamped};
}
function checkBodyAndRate(plan){
  if(!plan||typeof plan!=="object")return{ok:false,blocked:true,code:"invalid",reason:"Invalid plan"};
  const goal=plan.goal||"loss";
  const sex=plan.sex;

    return{ok:false,blocked:true,code:"range",reason:lang==="zh"?"请输入有效的身体数据与天数(7~180天)。":"나이, 키, 체중, 기간(7~180일)을 올바르게 입력하세요."};
  }
  const sw=Number(rawSw),tw=Number(rawTw),ht=Number(rawHt),age=Number(rawAge),days=Number(rawDays);

  }

    }
    if(tw>=sw){

    }
    const rate=calcWeeklyRate(sw,tw,days);
    if(rate>2.0){
      return{ok:false,blocked:true,rate,code:"rate_over_2",reason:lang==="zh"?`周均减重 ${rate.toFixed(2)}kg/周 超过 2kg/周安全上限，已阻止开始。请延长天数或调高目标体重。`:`주당 감량 속도(${rate.toFixed(2)}kg/주)가 2kg/주를 초과하여 차단되었습니다. 기간을 늘리거나 목표 체중을 높여주세요.`};

    }
  }else if(goal==="gain"){
    if(tw<=sw){
      return{ok:false,blocked:true,code:"gain_dir",reason:lang==="zh"?"增重模式下目标体重必须高于当前体重（或切换为减重/维持模式）。":"증량 모드에서는 목표 체중이 현재 체중보다 높아야 합니다. (감량/유지 모드로 전환하거나 목표를 수정하세요)"};
    }

    if(gRate>1.5){
      return{ok:false,blocked:true,warn:true,rate:gRate,code:"gain_rate",reason:lang==="zh"?`⚠️ 周均增重 ${gRate.toFixed(2)}kg/周 过快，请延长天数或调整目标体重。`:`⚠️ 주당 증량 속도(${gRate.toFixed(2)}kg/주)가 너무 빠릅니다. 기간이나 목표 체중을 다시 조정해주세요.`};
    }
  }
  return{ok:true,blocked:false,code:"ok",rate:calcWeeklyRate(sw,tw,days)};
}
function canStart(plan){

  }

function getExportObject(){

    b60lang:lang,

function exportBackup(){
  const payload=getExportObject();
  const json=JSON.stringify(payload,null,2);
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const dStr=td().replace(/-/g,"");
  a.href=url;
  a.download=`burn60_backup_${dStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),500);
  toast(lang==="zh"?"已导出备份 ✓":"백업 내보내기 완료 ✓");
  return payload;
}
function validateBackupObj(obj){
  if(!obj||typeof obj!=="object"||Array.isArray(obj))return false;
  const reqKeys=["b60lang","burn60_config","burn60_data","burn60_user"];
  for(const k of reqKeys){if(!(k in obj))return false}
  if(typeof obj.b60lang!=="string"||(obj.b60lang!=="ko"&&obj.b60lang!=="zh"))return false;
  if(obj.burn60_config!==null){
    if(typeof obj.burn60_config!=="object"||Array.isArray(obj.burn60_config))return false;
    if(!obj.burn60_config.startDate||!obj.burn60_config.totalDays||!obj.burn60_config.startWeight)return false;
  }
  if(!obj.burn60_data||typeof obj.burn60_data!=="object"||Array.isArray(obj.burn60_data))return false;
  if(!obj.burn60_user||typeof obj.burn60_user!=="object"||Array.isArray(obj.burn60_user)||typeof obj.burn60_user.xp!=="number")return false;
  if("burn60_coach" in obj&&obj.burn60_coach!==undefined&&obj.burn60_coach!==null){
    if(typeof obj.burn60_coach!=="object"||Array.isArray(obj.burn60_coach))return false;
  }
  if("burn60_sessions" in obj&&obj.burn60_sessions!==undefined){
    if(!Array.isArray(obj.burn60_sessions))return false;
  }
  if("burn60_learn" in obj&&obj.burn60_learn!==undefined){
    if(!obj.burn60_learn||typeof obj.burn60_learn!=="object"||Array.isArray(obj.burn60_learn))return false;
  }
  if("burn60_notes" in obj&&obj.burn60_notes!==undefined){
    if(!Array.isArray(obj.burn60_notes))return false;
  }
  return true;
}
function applyBackupObject(rawInput,skipConfirm){
  let obj=rawInput;
  if(typeof rawInput==="string"){
    try{obj=JSON.parse(rawInput)}catch(e){toast(lang==="zh"?"无效的JSON文件":"유효하지 않은 JSON 파일");return false}
  }
  if(!validateBackupObj(obj)){
    toast(lang==="zh"?"备份文件格式错误":"백업 파일 구조가 올바르지 않습니다");
    return false;
  }
  if(!skipConfirm){
    const ok=confirm(lang==="zh"?"导入备份将覆盖当前数据，确定继续？":"백업을 가져오면 현재 데이터를 덮어씁니다. 계속할까요?");
    if(!ok)return false;
  }
  lang=obj.b60lang;
  try{localStorage.setItem("b60lang",lang)}catch(e){}
  if(obj.burn60_config){
    cfg=Object.assign({},obj.burn60_config,{schemaVersion:3});
    saveC(cfg);
    if(obj.burn60_coach&&typeof obj.burn60_coach==="object"){
      const def=defaultCoach(cfg);
      coach=Object.assign({},def,cloneObj(obj.burn60_coach),{
        joints:Object.assign({},def.joints,obj.burn60_coach.joints||{}),
        fitness:Object.assign({},def.fitness,obj.burn60_coach.fitness||{})
      });
      if(!coach.plan)coach.plan=initialPlan(coach,cfg);
    }else{
      coach=defaultCoach(cfg);
    }
    saveCoach(coach);
  }else{
    cfg=null;
    coach=null;
    try{localStorage.removeItem(CK);localStorage.removeItem(COK)}catch(e){}
  }
  data=obj.burn60_data;
  saveD(data);
  usr=obj.burn60_user;
  saveU(usr);
  saveSessions(Array.isArray(obj.burn60_sessions)?cloneObj(obj.burn60_sessions):[]);
  saveLearn((obj.burn60_learn&&typeof obj.burn60_learn==="object")?Object.assign(defaultLearn(),cloneObj(obj.burn60_learn)):defaultLearn());
  saveNotes(Array.isArray(obj.burn60_notes)?cloneObj(obj.burn60_notes):[]);
  syncDocLang();
  render();
  toast(lang==="zh"?"备份导入成功 ✓":"백업 가져오기 완료 ✓");
  return true;
}
function triggerImport(){
  const inp=document.getElementById("import-file-input");
  if(inp)inp.click();
}
function handleImportFile(ev){
  const file=ev.target&&ev.target.files&&ev.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    applyBackupObject(e.target.result,false);
    ev.target.value="";
  };
  reader.readAsText(file);
}

function _todaySession(today2){
  return sessions.find(x=>x&&x.d===today2)||null;
}
function _markExQuestDone(today2){
  if(!data[today2])data[today2]={};
  if(!data[today2].quests)data[today2].quests={};
  if(!data[today2].quests.ex){
    data[today2].quests.ex=true;
    saveD(data);
    usr.xp=calcXP();
    saveU(usr);
  }
}
// ═══ ROUND FLOW: "이 라운드 완료" → 3-tap (breath, knee, done) → saved on the third tap ═══
// Today's rules are recomputed from the engine state at the start of the day (dayBase), so several rounds
// in one day count as ONE session for P1/R2 and never stack ladder moves.
const ENGINE_FIELDS=["plan","stairsLocked","lockReason","lockUntil","s3","reentry","ladderLog"];
let sessionOpen=false,restNotice=false;
function _engineSnap(c){const o={};ENGINE_FIELDS.forEach(k=>{o[k]=cloneObj(c[k]===undefined?null:c[k])});return o}
function _dayBaseFor(today2){
  if(!coach.dayBase||coach.dayBase.d!==today2)coach.dayBase={d:today2,engine:_engineSnap(coach)};
  return coach.dayBase.engine;
}
function _resnapDayBase(){if(coach&&coach.dayBase&&coach.dayBase.d===td())coach.dayBase.engine=_engineSnap(coach)}
function _learnApply(sess,sign){
  if(!sess)return;
  const sl=sess.slot||"evening",md=sess.mode||"flat";
  if(!learn.slots)learn.slots={};if(!learn.moves)learn.moves={};
  if(!learn.slots[sl])learn.slots[sl]={offered:0,done:0};
  if(!learn.moves[md])learn.moves[md]={offered:0,done:0};
  const p=(Number(sess.plannedRounds)||0)*sign,d=(Number(sess.doneRounds)||0)*sign;
  learn.slots[sl].offered=Math.max(0,learn.slots[sl].offered+p);learn.slots[sl].done=Math.max(0,learn.slots[sl].done+d);
  learn.moves[md].offered=Math.max(0,learn.moves[md].offered+p);learn.moves[md].done=Math.max(0,learn.moves[md].done+d);
}
function _evalToday(agg,bodyStop){
  const today2=td();
  const base=_dayBaseFor(today2);
  const baseCoach=Object.assign(cloneObj(coach),cloneObj(base));
  delete baseCoach.dayBase;delete baseCoach.draft;
  const cur=_todaySession(today2);
  const past=sessions.filter(x=>x&&x.d!==today2);
  const slot=(cur&&cur.slot)||(coach.slots&&coach.slots[0]&&coach.slots[0].name)||"evening";
  const res=applySession({coach:baseCoach,cfg,sessions:past},{plannedRounds:agg.plannedRounds,doneRounds:agg.doneRounds,doneAll:agg.doneAll,talk:agg.talk,pain:agg.pain,redFlag:agg.redFlag,bodyStop:Boolean(bodyStop||(cur&&cur.bodyStop)),missReason:agg.missReason,userPick:null,slot},today2);
  const keepDay=coach.dayBase;
  coach=Object.assign(cloneObj(coach),res.coach,{dayBase:keepDay,draft:null,lastMsgKey:res.msgKey,lastMsgRules:res.rules,lastMsgDate:today2});
  const sess=Object.assign(res.session,{agg});
  _learnApply(cur,-1);_learnApply(sess,1);
  saveLearn(learn,today2);
  saveCoach(coach);
  past.push(sess);
  saveSessions(past,today2);
  if(sess.doneRounds>=1)_markExQuestDone(today2);
  lastCoachMsg=_coachMsgText(res.msgKey,coach);
  return res;
}
function startRound(){
  syncFromStorage();
  if(!coach)coach=loadCoach(cfg);
  const today2=td();
  if(!coach.draft||coach.draft.d!==today2)coach.draft={d:today2,step:1,talk:null,pain:null,redFlag:false};

function answerRound(field,value){
  syncFromStorage();

  if(!coach.draft||coach.draft.d!==today2)coach.draft={d:today2,step:1,talk:null,pain:null,redFlag:false};
  const dr=coach.draft;
  if(field==="talk"){dr.talk=value;dr.step=2}
  else if(field==="pain"){dr.pain=value;dr.step=3}

function submitRound(done){
  const today2=td();
  const dr=coach.draft||{talk:null,pain:0,redFlag:false};
  const base=_dayBaseFor(today2);
  const planned=(base.plan&&base.plan.N)||(coach.plan&&coach.plan.N)||1;
  const cur=_todaySession(today2);
  const agg=mergeRound(cur&&cur.agg?cur.agg:null,{talk:dr.talk,pain:dr.pain,redFlag:dr.redFlag,done},planned);
  const res=_evalToday(agg,false);
  sessionOpen=false;

  render();
  return res;

      <div class="sf"><label class="sl" for="set-in-top">${z?"最高层":"맨 위 층"}</label><input class="si" type="number" id="set-in-top" data-testid="set-top-floor" value="${fmtIn(p.topFloor||"")}"></div>
    </div>
    <div class="ob-opts">

      <button type="button" class="ob-opt ${p.elevator==="some"?"on":""}" data-testid="set-elev-some" onclick="setPlaceField('elevator','some')">${z?"有时":"가끔"}</button>
      <button type="button" class="ob-opt ${p.elevator==="no"?"on":""}" data-testid="set-elev-no" onclick="setPlaceField('elevator','no')">${z?"无电梯":"없음"}</button>
    </div>
    <div style="font-size:11px;margin-bottom:8px"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="set-in-hr" data-testid="set-handrail" ${p.handrail?"checked":""}><span>${z?"有扶手":"손잡이 있음"}</span></label></div>
    <div class="cc-sttl">${z?"膝盖状态":"무릎 상태"}</div>
    <div class="ob-opts">
      <button type="button" class="ob-opt ${setDraft.joints.knee==="none"?"on":""}" data-testid="set-knee-none" onclick="setDraftKnee('none')">${z?"无不适":"없음"}</button>
      <button type="button" class="ob-opt ${setDraft.joints.knee==="mild"?"on":""}" data-testid="set-knee-mild" onclick="setDraftKnee('mild')">${z?"偶尔不适":"가끔 불편"}</button>
      <button type="button" class="ob-opt ${setDraft.joints.knee==="now"?"on":""}" data-testid="set-knee-now" onclick="setDraftKnee('now')">${z?"现在疼痛":"지금 아픔"}</button>
    </div>
    <div class="cc-sttl">${z?"运动时段 (最多3个)":"시간대 (최대 3개)"}</div>
    <div class="ob-opts">
      ${setDraft.slots.map((sl,idx)=>`<button type="button" class="ob-opt ${setSlotIdx===idx?"on":""}" data-testid="set-slot-tab-${idx}" onclick="syncSetInputs();setSlotIdx=${idx};render()">#${idx+1} ${sl.name}</button>`).join("")}
      ${setDraft.slots.length<3?`<button type="button" class="ob-opt" data-testid="set-slot-add" onclick="addSetSlot()">+ ${z?"添加":"추가"}</button>`:""}
    </div>
    <div class="ob-opts">
      ${[["morning",z?"早上":"아침"],["lunch",z?"中午":"점심"],["afternoon",z?"下午":"오후"],["evening",z?"晚上":"저녁"]].map(([k,l])=>`<button type="button" class="ob-opt ${s.name===k?"on":""}" data-testid="set-slot-${k}" onclick="setSlotField('name','${k}')">${l}</button>`).join("")}
    </div>
    <div class="sf" style="margin-bottom:8px"><input class="si" style="font-size:12px;padding:8px" type="text" id="set-in-time" data-testid="set-slot-time" value="${SLOT_TIME_MAP[s.name]?"":fmtIn(s.name)}" placeholder="HH:MM (예: 18:30)"></div>
    <div class="ob-opts">
      ${[2,5,10].map(m=>`<button type="button" class="ob-opt ${Number(s.min)===m?"on":""}" data-testid="set-min-${m}" onclick="setSlotField('min',${m})">${m}${z?"分钟":"분"}</button>`).join("")}
    </div>
    <div class="cc-sttl">${z?"运动日":"운동 요일"}</div>
    <div class="ob-opts">
      ${dNames.map((dn,di)=>`<button type="button" class="ob-opt" style="min-width:36px;flex:1;padding:8px 2px;${setDraft.days.includes(di)?"border-color:var(--cy);color:var(--cy);background:rgba(0,255,242,.14)":""}" data-testid="set-day-${di}" onclick="toggleSetDay(${di})">${dn}</button>`).join("")}
    </div>
    <div class="cc-sttl">${z?"运动强度":"운동 강도"}</div>
    <div class="ob-opts">
      <button type="button" class="ob-opt ${setDraft.level==="easy"?"on":""}" data-testid="set-level-easy" onclick="setDraftLevel('easy')">${z?"轻松":"쉬움"}</button>
      <button type="button" class="ob-opt ${setDraft.level==="normal"?"on":""}" data-testid="set-level-normal" onclick="setDraftLevel('normal')">${z?"普通":"보통"}</button>
      <button type="button" class="ob-opt ${setDraft.level==="hard"?"on":""}" data-testid="set-level-hard" onclick="setDraftLevel('hard')">${z?"高强":"어려움"}</button>
    </div>
    <div class="cc-sttl">${z?"每周复盘日":"주간 체크인 요일"}</div>
    <select id="set-in-cdow" class="si" style="font-size:13px;padding:8px;margin-bottom:10px" data-testid="set-checkin-dow" onchange="syncSetInputs()">
      ${dNames.map((dn,di)=>`<option value="${di}" ${Number(setDraft.checkinDow)===di?"selected":""}>${dn}</option>`).join("")}
    </select>
    <button type="button" class="sbtn" style="margin-top:4px;padding:12px;font-size:14px" data-testid="set-save" onclick="saveCoachSettings()">${z?"保存设置":"설정 저장"}</button>
  </div>`;
}

function renderCoachSection(today2){
  if(!coach)coach=loadCoach(cfg);
  const z=lang==="zh";
  const pl=coach.plan||initialPlan(coach,cfg);
  const tSess=_todaySession(today2);
  const curDone=tSess?Number(tSess.doneRounds)||0:0;
  const isWorkDay=Array.isArray(coach.days)&&coach.days.includes(dow(today2));
  const dailyRules=Array.isArray(coach.dailyRules)?coach.dailyRules:[];
  const canAskKnee=Boolean(coach.stairsLocked&&coach.lockReason==="knee"&&(!coach.lockUntil||today2>=coach.lockUntil));
  let h="";

  if(coach.unreadNote){
    const nt=coach.unreadNote;
    h+=`<div class="note-card" data-testid="weekly-note">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <b style="color:var(--ny)">📋 ${z?"本周教练笔记":"주간 코치 노트"} (${nt.wk})</b>
        <span style="font-size:9px;color:#889">[${(nt.rules||[]).join(", ")}]</span>
      </div>
      ${(nt.lines||[]).map(ln=>`<div>· ${ln}</div>`).join("")}
      <button type="button" class="cc-btn pri" style="margin-top:8px;width:100%" onclick="ackWeeklyNote()">${z?"确认":"확인"}</button>
    </div>`;
  }

  if(coach.goalReached&&!coach.maintenance){
    h+=`<div class="note-card">
      <div style="font-weight:700;color:var(--cy);margin-bottom:6px">${z?"达成目标！🎉 要切换到维持模式吗？饮食量略增，运动保持现状。":"목표 달성! 🎉 이제 유지 모드로 바꿀까요? 먹는 양은 조금 늘고, 운동은 지금 그대로예요."}</div>
      <button type="button" class="cc-btn pri" style="width:100%" data-testid="btn-maintenance" onclick="doAcceptMaint()">${z?"切换到维持模式":"유지 모드로 바꾸기"}</button>
    </div>`;
  }

  if(s1Open){
    h+=`<div class="cc-sheet" data-testid="s1-screen" style="border-color:var(--np)">
      <div class="cc-ttl" style="color:var(--np);margin-bottom:6px">🛑 ${z?"请立刻停止并坐下休息":"즉시 멈추고 앉아서 쉬세요"}</div>
      <div class="cc-desc">${z?"如果胸痛、头晕或呼吸困难没有缓解，请立即拨打急救电话（中国 120 / 韩国 119）。为安全起见，爬楼已锁定。":"가슴 통증이나 어지러움이 안 가라앉으면 즉시 응급 전화(한국 119 / 중국 120)에 연락하세요. 안전을 위해 계단 라운드가 잠겼습니다."}</div>
      <button type="button" class="cc-btn" style="width:100%" onclick="s1Open=false;render()">${z?"我知道了":"확인"}</button>
    </div>`;
  }

  const pLbl=_paceLabel(pl.pace,z);
  const dLbl=_descentLabel(pl.descent,z);
  const planIntro=(pl.mode==="stairs"&&!coach.stairsLocked)
    ?(z?`今天计划：爬 ${pl.R}层楼 × ${pl.N}轮 · ${pLbl}（${dLbl}）`:`오늘 계획: 계단 ${pl.R}층 × ${pl.N}라운드 · ${pLbl} (${dLbl})`)
    :(z?`今天计划：平地快走·原地踏步 3分钟 × ${pl.N}轮`:`오늘 계획: 빠르게 걷기·제자리 걷기 3분 × ${pl.N}라운드`);

  const msgToShow=(tSess&&tSess.judged)?_coachMsgText(coach.lastMsgKey||"p0",coach):(coach.lastMsgDate===today2&&lastCoachMsg?lastCoachMsg:"");

  h+=`<div class="cc-card" data-testid="coach-card">
    <div class="cc-hdr">
      <span class="cc-ttl">🏃 ${z?"今日自适应教练":"오늘의 적응형 코치"}</span>
      ${isWorkDay?`<span class="cc-prog">${z?`轮次 ${curDone}/${pl.N}`:`라운드 ${curDone}/${pl.N}`}</span>`:""}
    </div>
    ${dailyRules.includes("M1")?`<div class="cc-msg" data-testid="coach-m1">${z?"昨天休息了。没关系，偶尔漏一次不会破坏习惯。今天从1轮开始。":"어제는 쉬었네요. 괜찮아요, 한 번 쉰다고 습관이 무너지진 않아요. 오늘 1라운드부터 해요."}</div>`:""}
    ${(coach.reentry&&today2<=coach.reentry.until)?`<div class="cc-msg">${z?"欢迎回来！这周先从一半的量、轻松强度开始。":"다시 와서 반가워요! 이번 주는 절반만, 쉽게 시작해요."}</div>`:""}
    ${(coach.needRetest||retestOpen)?`<div class="cc-msg">
      <div style="margin-bottom:6px">${z?"超过14天未记录，建议重新自测能不喘气爬几层：":"14일 이상 공백이 있었어요. 숨차기 전 몇 층까지 가능한지 다시 테스트해 볼까요?"}</div>
      <div style="display:flex;gap:6px">
        <input type="number" min="1" max="30" id="retest-input" class="si" style="padding:6px;font-size:13px;flex:1" value="${fmtIn(retestVal)}" placeholder="${z?"层数":"층수"}" oninput="onRetestInput(this,false)" onchange="onRetestInput(this,true)">
        <button type="button" class="cc-btn pri" data-testid="btn-retest" onclick="doRetest()">${z?"重新自测":"자가 테스트 다시 하기"}</button>
      </div>
    </div>`:""}
    ${coach.stairsLocked?`<div class="cc-msg" style="border-color:var(--np);color:#ffd0e0">
      <div>🔒 ${coach.lockReason==="body"?(z?"因身体停止信号，爬楼已暂停并改为平地代替方案。":"몸 이상 신호로 계단이 잠겨 평지 대안으로 진행합니다."):(z?`因膝盖保护，爬楼已暂停（至${coach.lockUntil||""}改为平地步行）。`:`무릎 보호를 위해 계단이 잠겨 평지 대안으로 전환되었습니다(${coach.lockUntil||""}까지).`)}</div>
      ${coach.lockReason==="body"?`<button type="button" class="cc-btn pri" style="margin-top:6px;width:100%" data-testid="btn-unlock-body" onclick="doUnlockBody()">${z?"已经恢复，重新开始":"괜찮아졌어요, 다시 시작"}</button>`:""}
      ${canAskKnee?`<div style="margin-top:6px"><div style="margin-bottom:4px">${z?"膝盖疼痛为0了吗？":"무릎 통증 0인가요?"}</div><button type="button" class="cc-btn pri" style="width:100%" data-testid="btn-unlock-knee" onclick="doUnlockKnee()">${z?"是的，膝盖无痛（解锁）":"네, 통증 0이에요 (잠금 해제)"}</button></div>`:""}
    </div>`:""}
    ${!isWorkDay
      ?`<div class="cc-desc" style="color:var(--nv);font-weight:700">${z?"今天是休息日":"오늘은 쉬는 날"}</div>`
      :(tSess&&tSess.judged)?`<div class="cc-desc" data-testid="coach-done-today">${planIntro}<div style="font-size:11px;color:var(--cy);margin-top:4px">✓ ${z?"今天已打卡":"오늘 체크 완료"}</div></div>
        <div class="cc-btns"><button type="button" class="cc-btn warn" data-testid="btn-stop" onclick="doBodyStop()">${z?"身体不适：停止信号":"몸이 이상해요: 멈춤 신호"}</button></div>`
      :`<div class="cc-desc">${planIntro}${coach.suggestSlot?`<div style="font-size:10px;color:var(--cy);margin-top:2px">💡 ${z?"推荐完成率高时段":"추천 시간대"}: ${coach.suggestSlot}</div>`:""}</div>
        <div class="cc-btns">
          ${coach.firstButton==="oneRound"?`<button type="button" class="cc-btn pri" data-testid="btn-one-round" onclick="doOneRound()">${z?"先做1轮":"1라운드만"}</button>`:""}
          <button type="button" class="cc-btn pri" data-testid="btn-round-done" onclick="doRoundDone()">${z?"完成1轮 (+1)":"라운드 1개 완료"}</button>
          <button type="button" class="cc-btn" data-testid="btn-check" onclick="openCheckSheet()">${z?"结束并打卡":"끝내고 체크"}</button>
          <button type="button" class="cc-btn warn" data-testid="btn-stop" onclick="doBodyStop()">${z?"身体不适：停止信号":"몸이 이상해요: 멈춤 신호"}</button>
        </div>`}
    ${msgToShow?`<div class="cc-msg" style="margin-top:8px;margin-bottom:0" data-testid="coach-msg">💬 ${msgToShow}</div>`:""}
    <details class="cc-stop" data-testid="stop-signs">
      <summary>⚠️ ${z?"运动停止信号与膝盖危险信号 (MedlinePlus, NHS)":"멈춤 신호 및 무릎 위험 신호 안내 (MedlinePlus, NHS)"}</summary>
      <div style="margin-top:6px">
        <div><b>${z?"全身停止信号":"몸 멈춤 신호"}:</b> ${z?"头晕、胸痛、心跳不规律、呼吸极度困难、恶心 → 立即停止并休息（不缓解请拨打 中国 120 / 韩国 119）":"어지러움, 가슴 통증, 불규칙한 심장 박동, 숨이 너무 참, 메스꺼움 → 즉시 멈춤 (한국 119 / 중국 120)"}</div>
        <div style="margin-top:4px"><b>${z?"膝盖危险信号":"무릎 위험 신호"}:</b> ${z?"剧烈疼痛、无法活动或无法承重、明显肿胀或变形、卡住/打软腿/疼痛弹响、发热且膝盖红热 → 暂停爬楼并就医":"심하게 아픔, 움직이거나 체중을 못 실음, 많이 붓거나 모양이 변함, 잠기거나 꺾이거나 아픈 딸깍, 열+무릎이 붉고 뜨거움"}</div>
        <div style="margin-top:4px;color:#778">${z?"来源：MedlinePlus, NHS":"출처: MedlinePlus, NHS"}</div>
      </div>
    </details>
  </div>`;

  if(checkSheetOpen){
    const doneTxt=curDone>=pl.N?(z?"全部完成":"다 함"):curDone>0?(z?`完成部分 (${curDone}/${pl.N})`:`일부 (${curDone}/${pl.N})`):(z?"未完成 (0轮)":"못 함 (0라운드)");
    h+=`<div class="cc-sheet" data-testid="check-sheet">
      <div class="cc-hdr"><span class="cc-ttl">✅ ${z?"10秒运动反馈 (3步)":"세션 후 3탭 체크"}</span><button type="button" class="lang-btn" onclick="checkSheetOpen=false;render()">✕</button></div>
      <div class="cc-sttl">1. ${z?"刚才运动时呼吸怎么样？":"말하기 (숨찬 정도)"}</div>
      <div class="ob-opts">
        <button type="button" class="ob-opt ${checkForm.talk===3?"on":""}" data-testid="talk-3" onclick="setCheckField('talk',3)">${z?"还能哼歌":"노래 가능"}</button>
        <button type="button" class="ob-opt ${checkForm.talk===5.5?"on":""}" data-testid="talk-5.5" onclick="setCheckField('talk',5.5)">${z?"能说话":"말은 됨"}</button>
        <button type="button" class="ob-opt ${checkForm.talk===7.5?"on":""}" data-testid="talk-7.5" onclick="setCheckField('talk',7.5)">${z?"只能说几个字":"몇 마디만"}</button>
        <button type="button" class="ob-opt ${checkForm.talk===9?"on":""}" data-testid="talk-9" onclick="setCheckField('talk',9)">${z?"说不出话":"말 못 함"}</button>
      </div>
      <div class="cc-sttl">2. ${z?"膝盖与关节感觉":"무릎·관절"}</div>
      <div class="ob-opts">
        <button type="button" class="ob-opt ${checkForm.pain===0?"on":""}" data-testid="pain-0" onclick="setCheckField('pain',0)">${z?"没问题":"괜찮음"}</button>
        <button type="button" class="ob-opt ${checkForm.pain===1?"on":""}" data-testid="pain-1" onclick="setCheckField('pain',1)">${z?"有点不舒服":"조금 불편"}</button>
        <button type="button" class="ob-opt ${checkForm.pain===2?"on":""}" data-testid="pain-2" onclick="setCheckField('pain',2)">${z?"疼痛":"아픔"}</button>
      </div>
      <div style="font-size:11px;margin-bottom:8px"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" data-testid="chk-redflag" ${checkForm.redFlag?"checked":""} onchange="setCheckField('redFlag',this.checked)"><span>${z?"有膝盖危险信号（肿胀/卡住/无法承重）":"위험 신호 있었음"}</span></label></div>
      <div class="cc-sttl">3. ${z?"完成情况":"다 했나요"}: <span style="color:#fff">${doneTxt}</span></div>
      <div class="ob-opts">
        <button type="button" class="ob-opt ${checkForm.missReason==="time"?"on":""}" data-testid="miss-time" onclick="setCheckField('missReason',checkForm.missReason==='time'?null:'time')">${z?"没时间":"시간 없음"}</button>
        <button type="button" class="ob-opt ${checkForm.missReason==="hard"?"on":""}" data-testid="miss-hard" onclick="setCheckField('missReason',checkForm.missReason==='hard'?null:'hard')">${z?"太吃力":"힘듦"}</button>
        <button type="button" class="ob-opt ${checkForm.missReason==="pain"?"on":""}" data-testid="miss-pain" onclick="setCheckField('missReason',checkForm.missReason==='pain'?null:'pain')">${z?"疼痛不适":"아픔"}</button>
      </div>
      <div class="cc-sttl">${z?"下次偏好 (选填)":"다음 세션 희망 강도 (선택)"}</div>
      <div class="ob-opts">
        <button type="button" class="ob-opt ${checkForm.userPick==="easier"?"on":""}" data-testid="pick-easier" onclick="setCheckField('userPick',checkForm.userPick==='easier'?null:'easier')">${z?"更轻松":"더 쉽게"}</button>
        <button type="button" class="ob-opt ${checkForm.userPick==="same"?"on":""}" data-testid="pick-same" onclick="setCheckField('userPick',checkForm.userPick==='same'?null:'same')">${z?"保持不变":"그대로"}</button>
        <button type="button" class="ob-opt ${checkForm.userPick==="harder"?"on":""}" data-testid="pick-harder" onclick="setCheckField('userPick',checkForm.userPick==='harder'?null:'harder')">${z?"更有挑战":"더 세게"}</button>
      </div>
      <button type="button" class="sbtn" style="margin-top:6px;padding:12px;font-size:14px" data-testid="btn-check-save" onclick="saveCheckSheet()">${z?"保存反馈":"체크 저장"}</button>
    </div>`;
  }
  return h;
}

// ═══ RENDER ═══
function render(){
syncFromStorage();
const app=document.getElementById("app");
if(!cfg){app.innerHTML=renderOnboarding();return}
const today2=td();
if(!coach){coach=loadCoach(cfg);saveCoach(coach)}
if(coach.lastDaily!==today2){
  const dc=dailyCheck({coach,cfg,sessions},today2);
  coach=dc.coach;
  coach.lastDaily=today2;
  coach.dailyRules=dc.rules;
  coach.askUnlock=dc.askUnlock;

function _buildInitialCoach(cfgObj,isHook,customPlan){
  const c=defaultCoach(cfgObj);
  if(isHook){
    if(customPlan&&customPlan.coach&&typeof customPlan.coach==="object"){
      const pc=customPlan.coach;
      if(Array.isArray(pc.places))c.places=cloneObj(pc.places);
      if(pc.activePlace!==undefined)c.activePlace=pc.activePlace;
      if(pc.joints&&typeof pc.joints==="object")c.joints=Object.assign({},c.joints,pc.joints);
      if(pc.fitness&&typeof pc.fitness==="object")c.fitness=Object.assign({},c.fitness,pc.fitness);
      if(Array.isArray(pc.slots)&&pc.slots.length)c.slots=cloneObj(pc.slots);
      if(Array.isArray(pc.days)&&pc.days.length)c.days=pc.days.slice();
      if(Array.isArray(pc.equip))c.equip=pc.equip.slice();
      if(pc.level)c.level=pc.level;
      if(pc.checkinDow!==undefined)c.checkinDow=pc.checkinDow;
      if(c.level==="hard"&&!hardAllowed(c,cfgObj))c.level="normal";
      c.plan=pc.plan?cloneObj(pc.plan):initialPlan(c,cfgObj);
    }
    return c;
  }
  const topF=parseInt(ob.obTopFloor,10)||parseInt(ob.obFloors,10)||0;
  const totF=parseInt(ob.obFloors,10)||topF||0;
  const stF=parseInt(ob.obStartFloor,10)||1;
  if(topF>0){
    c.places=[{name:ob.obPlaceName||"home",floorsTotal:totF,startFloor:stF,topFloor:topF,elevator:ob.obElev||"no",handrail:Boolean(ob.obHandrail)}];
  }
  c.joints.knee=_effObKnee();
  if(ob.obQuick)c.fitness.quick=ob.obQuick;
  c.slots=[{name:ob.obSlot||"evening",min:Number(ob.obMin)||5}];
  c.level=ob.obLevel||"easy";
  if(c.level==="hard"&&!hardAllowed(c,cfgObj))c.level="normal";
  c.plan=initialPlan(c,cfgObj);
  return c;
}

function startC(customPlan){
  syncObInputs();
  const isHook=!!(customPlan&&typeof customPlan==="object");
  const p=isHook?customPlan:ob;
  const rawSw=(isHook&&"startWeight" in customPlan)?customPlan.startWeight:p.startWeight;
  const rawHt=(isHook&&"height" in customPlan)?customPlan.height:p.height;
  const rawAge=(isHook&&"age" in customPlan)?customPlan.age:p.age;
  const rawDays=(isHook&&("totalDays" in customPlan||"days" in customPlan))?(customPlan.totalDays!==undefined?customPlan.totalDays:customPlan.days):(p.totalDays!==undefined?p.totalDays:(p.days!==undefined?p.days:ob.days));
  const sex=(isHook&&"sex" in customPlan)?customPlan.sex:p.sex;
  const sw=(rawSw===""||rawSw===null||rawSw===undefined)?NaN:parseFloat(rawSw);
  const ht=(rawHt===""||rawHt===null||rawHt===undefined)?NaN:parseFloat(rawHt);
  const age=(rawAge===""||rawAge===null||rawAge===undefined)?NaN:parseInt(rawAge,10);
  const days=(rawDays===""||rawDays===null||rawDays===undefined)?NaN:parseInt(rawDays,10);
  const goal=p.goal||ob.goal||"loss";
  const rawTw=(isHook&&"targetWeight" in customPlan)?customPlan.targetWeight:p.targetWeight;
  const tw=goal==="maintain"?sw:((rawTw===""||rawTw===null||rawTw===undefined)?NaN:parseFloat(rawTw));
  const hookExplicitAgeSex=isHook&&("age" in customPlan)&&("sex" in customPlan);
  const med=isHook?(("med" in customPlan)?customPlan.med:(ob.med||(hookExplicitAgeSex?"none":""))):ob.med;
  const ed=isHook?(("ed" in customPlan)?customPlan.ed:(ob.ed||(hookExplicitAgeSex?"none":""))):ob.ed;
  const preg=isHook?(("preg" in customPlan)?customPlan.preg:(ob.preg||(hookExplicitAgeSex?(sex==="f"?"no":""):""))):ob.preg;
  const fullPlan=Object.assign({},ob,p,{goal,sex,startWeight:sw,targetWeight:tw,height:ht,age,totalDays:days,days,med,ed,preg});
  const check=canStart(fullPlan);
  if(!check.ok){
    toast(check.reason);
    return check;
  }
  const startDate=p.startDate||td();
  const endDate=addD(startDate,days-1);
  const cal=calcCaloriePlan(fullPlan);
  cfg={
    schemaVersion:3,
    goal,
    muscle:!!fullPlan.muscle,
    sex:fullPlan.sex,
    age,
    height:ht,
    startWeight:sw,
    targetWeight:tw,
    totalDays:days,
    startDate,
    endDate,
    med:fullPlan.med,
    medAck:!!fullPlan.medAck,
    pains:Array.isArray(fullPlan.pains)?fullPlan.pains:["none"],
    preg:fullPlan.sex==="f"?fullPlan.preg:"no",
    ed:fullPlan.ed,
    workType:fullPlan.workType||"standing",
    pal:resolvePal(fullPlan.pal||fullPlan.workType),
    mealType:fullPlan.mealType||"out",
    allergy:fullPlan.allergy||"none",
    allergyMemo:fullPlan.allergyMemo||"",
    exTime:fullPlan.exTime||"10",
    exPlace:fullPlan.exPlace||"",
    preset:goal==="loss"?(fullPlan.preset||"flex"):goal,
    bmr:cal.bmrRound,
    tdee:cal.tdeeRound,
    recCalMin:cal.recMin,
    recCalMax:cal.recMax
  };
  saveC(cfg);
  coach=_buildInitialCoach(cfg,isHook,customPlan);
  saveCoach(coach);
  saveSessions([]);
  saveLearn(defaultLearn());
  saveNotes([]);
  checkSheetOpen=false;s1Open=false;settingsOpen=false;retestOpen=false;lastCoachMsg="";
  data={};
  data[startDate]={weight:sw};
  saveD(data);
  usr={xp:0};
  saveU(usr);
  curView="quest";
  toast(lang==="zh"?"挑战开始！💪":"도전 시작! 💪");
  render();
  return{ok:true,cfg,coach};
}
