<!DOCTYPE html>
<!-- burn60 v2 - single-file offline health challenge app (Mifflin-St Jeor direct implementation) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="버닝 챌린지">
<title>🔥 버닝 챌린지</title>
<style>
:root{--cy:#00fff2;--mg:#ff00ff;--ny:#f0ff00;--np:#ff2d7b;--eb:#0080ff;--nv:#bf00ff;--bg:#06060e;--glass:rgba(255,255,255,0.04);--glass2:rgba(255,255,255,0.07);--gborder:rgba(255,255,255,0.08);--gborder2:rgba(255,255,255,0.12);--dim:#556;--txt:#d8dce8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;max-width:420px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;overflow-x:hidden;background-image:radial-gradient(ellipse at 20% 50%,rgba(0,255,242,.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(255,0,255,.03) 0%,transparent 50%)}
/* glass card */
.gc{background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--gborder);box-shadow:0 0 20px rgba(0,0,0,.3)}
.gc2{background:var(--glass2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--gborder2)}
/* neon glow */
.glow-cy{text-shadow:0 0 8px rgba(0,255,242,.5)}
.glow-mg{text-shadow:0 0 8px rgba(255,0,255,.5)}
.glow-ny{text-shadow:0 0 8px rgba(240,255,0,.5)}
.glow-np{text-shadow:0 0 8px rgba(255,45,123,.5)}
.glow-eb{text-shadow:0 0 8px rgba(0,128,255,.5)}
.glow-nv{text-shadow:0 0 8px rgba(191,0,255,.5)}
/* setup */
.setup{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
.setup-logo{text-align:center;font-size:48px;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(0,255,242,.4))}
.setup-title{text-align:center;font-size:28px;font-weight:800;color:var(--cy);margin-bottom:4px;text-shadow:0 0 20px rgba(0,255,242,.4)}
.setup-sub{text-align:center;font-size:13px;color:var(--dim);margin-bottom:32px}
.sf{margin-bottom:18px}
.sl{font-size:11px;color:#889;font-weight:600;margin-bottom:5px;display:block}
.si{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--gborder2);border-radius:12px;padding:13px 16px;color:#fff;font-size:17px;font-weight:700;outline:none;font-family:monospace;text-align:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.si:focus{border-color:var(--cy);box-shadow:0 0 12px rgba(0,255,242,.2)}
.si::placeholder{color:#334;font-weight:400}
.sr{display:flex;gap:10px}.sr .sf{flex:1}
.su{font-size:10px;color:#556;text-align:center;margin-top:3px}
.sbtn{width:100%;padding:16px;border:none;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer;margin-top:12px;background:linear-gradient(135deg,var(--cy),var(--eb));color:#000;box-shadow:0 0 30px rgba(0,255,242,.3);transition:transform .1s}
.sbtn:active{transform:scale(.96)}
.shint{text-align:center;font-size:10px;color:#445;margin-top:16px;line-height:1.6}
/* header */
.hdr{padding:14px 16px 2px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:17px;font-weight:800;color:var(--cy);text-shadow:0 0 15px rgba(0,255,242,.4)}
.hdr-r{display:flex;gap:6px;align-items:center}
.lang-btn{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--gborder);border-radius:8px;padding:4px 8px;color:#889;font-size:9px;font-weight:600;cursor:pointer}
.lvl-b{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(240,255,0,.2);border-radius:8px;padding:4px 10px;font-size:10px;font-weight:700;color:var(--ny);text-shadow:0 0 8px rgba(240,255,0,.3)}
.hdr-sub{font-size:9px;color:#556;padding:0 16px 4px;font-weight:500}
/* bottom nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:rgba(6,6,14,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--gborder);padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:100}
.bnav button{flex:1;border:none;background:none;color:#445;font-size:9px;font-weight:600;cursor:pointer;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .2s}
.bnav button.act{color:var(--cy)}
.bnav .ni{font-size:18px}
.ct{padding:0 14px}
.ct2{font-size:13px;font-weight:700;margin-bottom:8px;color:#aab}
.cr{display:flex;justify-content:space-between;align-items:center}
.dm{font-size:10px;color:var(--dim);margin-top:2px;font-weight:500}
/* quest items */
.qt{font-size:9px;font-weight:700;color:#445;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
.qt .ql{flex:1;height:1px;background:rgba(255,255,255,.05)}
.qi{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--gborder);border-radius:12px;margin-bottom:5px;cursor:pointer;transition:all .15s}
.qi:active{transform:scale(.98)}
.qi.dn{border-color:rgba(0,255,242,.15);background:rgba(0,255,242,.03)}
.qi.dn .qc{background:var(--cy);border-color:var(--cy);color:#000;box-shadow:0 0 10px rgba(0,255,242,.3)}
.qc{width:26px;height:26px;border-radius:7px;border:2px solid #334;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;transition:all .2s}
.qct{flex:1}.qct .t{font-size:12px;font-weight:600}.qct .d{font-size:10px;color:var(--dim);margin-top:1px}
.qe{font-size:20px;flex-shrink:0}
/* ring */
.ds{display:flex;align-items:center;gap:14px;padding:2px 0}
.rw{position:relative;width:66px;height:66px;flex-shrink:0}
.rtx{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.rn{font-size:16px;font-weight:800;color:#fff;font-family:monospace}
.rl{font-size:8px;color:var(--dim)}
.dst{flex:1}.dsr{display:flex;justify-content:space-between;padding:2px 0;font-size:11px}
.dsl{color:#778}.dsv{font-weight:700;font-family:monospace}
/* xp */
.xpbar{background:rgba(255,255,255,.06);border-radius:4px;height:5px;margin-top:5px;overflow:hidden}
.xpfill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ny),var(--mg));transition:width .5s;box-shadow:0 0 6px rgba(240,255,0,.3)}
.xplbl{font-size:8px;color:#556;margin-top:2px;text-align:right}
/* menu */
.mc{margin-bottom:4px}
.mct{font-size:11px;font-weight:700;padding:6px 0 3px;color:#889;cursor:pointer;display:flex;justify-content:space-between}
.mct:after{content:"▾";font-size:9px;color:#445}
.mc.op .mct:after{content:"▴"}
.ml{display:none;padding:0 0 2px}.mc.op .ml{display:block}
.mi{font-size:10px;color:#778;padding:3px 10px;line-height:1.6}
.mn{font-size:8px;color:#556}
/* weight */
.bn{font-size:32px;font-weight:800;color:#fff;font-family:monospace;line-height:1}
.sb{text-align:center;flex:1}
.sn{font-size:17px;font-weight:800;color:#fff;font-family:monospace}
.pb{background:rgba(255,255,255,.06);border-radius:5px;height:6px;margin-top:10px;overflow:hidden}
.pf{height:100%;border-radius:5px;transition:width .5s;background:linear-gradient(90deg,var(--cy),var(--eb));box-shadow:0 0 8px rgba(0,255,242,.2)}
.plb{font-size:9px;color:var(--dim);margin-top:4px;text-align:center}
.ir{display:flex;gap:8px;margin-top:8px}
.ir input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--gborder2);border-radius:10px;padding:11px 12px;color:#fff;font-size:15px;font-weight:600;outline:none;font-family:monospace;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.svb{background:linear-gradient(135deg,var(--cy),var(--eb));border:none;border-radius:10px;padding:11px 18px;color:#000;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 0 12px rgba(0,255,242,.2)}
.svh{font-size:10px;color:var(--cy);margin-top:5px;font-weight:500}
.csv{width:100%;max-width:380px;display:block;margin:0 auto}
.ech{text-align:center;color:#445;font-size:11px;padding:20px 0}
/* info row */
.info-r{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.info-r:last-child{border:none}
.info-l{font-size:11px;color:#667}.info-v{font-size:11px;font-weight:700;font-family:monospace}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px}
.cal-h{font-size:8px;color:#556;text-align:center;font-weight:600;padding:2px 0}
.cal-d{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:#334;background:rgba(255,255,255,.02)}
.cal-d.c1{background:rgba(0,255,242,.12);color:var(--cy);box-shadow:inset 0 0 6px rgba(0,255,242,.1)}
.cal-d.c2{background:rgba(240,255,0,.1);color:var(--ny)}
.cal-d.c3{background:rgba(255,45,123,.1);color:var(--np)}
.cal-d.c4{background:rgba(255,255,255,.02);color:#445}
.cal-d.cs{background:rgba(191,0,255,.08);color:var(--nv)}
/* history */
.hl{max-height:350px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hi{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px}
.hd{font-weight:600}.hdy{font-size:9px;color:var(--dim);margin-left:4px;font-family:monospace}
.hic{display:flex;gap:7px;align-items:center}
.hw{font-weight:700;color:var(--cy);font-family:monospace;min-width:44px;text-align:right}
.hn{color:#334;min-width:44px;text-align:right}
.hp{font-weight:700;font-family:monospace;min-width:32px;text-align:right}
/* badges */
.bdg{display:inline-flex;align-items:center;gap:4px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(240,255,0,.15);border-radius:8px;padding:4px 8px;font-size:9px;font-weight:600;color:var(--ny);margin:2px}
.bdg.locked{opacity:.2;filter:grayscale(1);border-color:var(--gborder)}
.bdg-next{font-size:10px;color:#778;padding:8px 0;border-top:1px solid rgba(255,255,255,.04);margin-top:8px}
/* rest day */
.rest{text-align:center;padding:50px 20px}
.rest .re{font-size:56px;margin-bottom:12px;filter:drop-shadow(0 0 20px rgba(191,0,255,.3))}
.rest .rt{font-size:18px;font-weight:800;color:var(--nv);text-shadow:0 0 15px rgba(191,0,255,.4)}
.rest .rs{font-size:12px;color:#556;line-height:1.8;margin-top:8px}
/* toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--glass2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(0,255,242,.2);color:var(--cy);padding:6px 18px;border-radius:18px;font-size:12px;z-index:999;font-weight:600;box-shadow:0 0 20px rgba(0,255,242,.15);transition:opacity .3s;pointer-events:none}
.toast.hide{opacity:0}
.rbtn{width:100%;padding:10px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,45,123,.15);border-radius:10px;color:var(--np);font-size:11px;font-weight:500;cursor:pointer;margin-top:4px;margin-bottom:10px}
.ebtn{width:100%;padding:10px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(0,255,242,.1);border-radius:10px;color:var(--cy);font-size:11px;cursor:pointer;margin-bottom:5px;opacity:.6}
.streak-b{display:inline-flex;align-items:center;gap:3px;background:rgba(240,255,0,.08);border:1px solid rgba(240,255,0,.2);border-radius:7px;padding:3px 8px;font-size:10px;font-weight:700;color:var(--ny);text-shadow:0 0 6px rgba(240,255,0,.3)}
/* overlay */
.ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(6,6,14,.92);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* animations */
.anim-char{font-size:64px;animation:bounce 0.6s ease infinite alternate;filter:drop-shadow(0 0 30px rgba(0,255,242,.5))}
@keyframes bounce{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-20px) scale(1.1)}}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes slideIn{0%{transform:translateX(-100vw)}50%{transform:translateX(10px)}100%{transform:translateX(0)}}
@keyframes disco{0%{transform:rotate(-10deg) scale(1)}25%{transform:rotate(10deg) scale(1.1)}50%{transform:rotate(-10deg) scale(1)}75%{transform:rotate(10deg) scale(1.1)}100%{transform:rotate(-10deg) scale(1)}}
@keyframes drop{0%{transform:translateY(-100vh) rotate(0)}60%{transform:translateY(0) rotate(360deg)}80%{transform:translateY(-30px)}100%{transform:translateY(0)}}
@keyframes fireSpin{0%{transform:rotate(0) scale(.5);opacity:0}50%{transform:rotate(180deg) scale(1.3);opacity:1}100%{transform:rotate(360deg) scale(1);opacity:1}}
@keyframes flyBy{0%{transform:translateX(-100vw) translateY(0)}50%{transform:translateX(0) translateY(-30px)}100%{transform:translateX(100vw) translateY(0)}}
.anim-msg{font-size:22px;font-weight:800;margin-top:12px;background:linear-gradient(90deg,var(--cy),var(--mg),var(--ny));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sparkle{position:absolute;font-size:20px;animation:sparkle 1s ease-out forwards}
@keyframes sparkle{0%{opacity:1;transform:scale(0)}50%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(0) translateY(-40px)}}
.game-canvas{border-radius:12px;background:rgba(0,0,0,.4);touch-action:none}
.game-hud{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;font-weight:700}
.game-lives{color:var(--np)}.game-score{color:var(--cy)}
.game-over-msg{font-size:13px;color:#778;text-align:center;margin-top:12px;font-style:italic;line-height:1.6}
.game-btn{background:linear-gradient(135deg,var(--cy),var(--eb));border:none;border-radius:12px;padding:14px 32px;color:#000;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px;box-shadow:0 0 25px rgba(0,255,242,.3)}
.game-btn:active{transform:scale(.95)}
/* weekly report */
.wr-box{text-align:center;padding:8px 0}
.wr-grade{font-size:36px;font-weight:800}
.wr-label{font-size:11px;color:#667;margin-top:2px}
/* v2 onboarding & disclaimer & backup */
.disc{font-size:10px;color:#778;line-height:1.5;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--gborder);margin-top:12px;text-align:left}
.ob-step{font-size:11px;color:var(--cy);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.ob-q{font-size:14px;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.4}
.ob-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ob-opt{flex:1 1 calc(50% - 6px);min-width:90px;padding:10px 8px;border-radius:10px;border:1px solid var(--gborder2);background:rgba(255,255,255,.04);color:var(--txt);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.ob-opt.on{border-color:var(--cy);background:rgba(0,255,242,.14);color:var(--cy);box-shadow:0 0 10px rgba(0,255,242,.2)}
.ob-nav{display:flex;gap:8px;margin-top:10px}
.ob-btn2{flex:1;padding:12px;border-radius:12px;border:1px solid var(--gborder2);background:var(--glass2);color:var(--txt);font-size:13px;font-weight:700;cursor:pointer}
.ob-warn{padding:10px 12px;border-radius:10px;background:rgba(240,255,0,.08);border:1px solid rgba(240,255,0,.3);color:var(--ny);font-size:11px;line-height:1.5;margin-bottom:10px}
.ob-stop{padding:12px;border-radius:10px;background:rgba(255,45,123,.12);border:1px solid rgba(255,45,123,.4);color:var(--np);font-size:12px;font-weight:700;line-height:1.5;margin-bottom:10px}
.tdee-box{padding:10px 12px;border-radius:10px;background:rgba(0,255,242,.05);border:1px solid rgba(0,255,242,.2);font-size:11px;line-height:1.6;margin-bottom:10px}
</style>
</head>

const PAL_MAP={sedentary:1.2,light:1.375,standing:1.55,moderate:1.55,labor:1.725,active:1.725};
function resolvePal(palOrWork){
  if(typeof palOrWork==="number"&&palOrWork>0)return palOrWork;
  return PAL_MAP[palOrWork]||1.55;
}
function calcBMR(sex,kg,cm,age){
  const w=Number(kg)||0,h=Number(cm)||0,a=Number(age)||0;
  const base=10*w+6.25*h-5*a;
  return(sex==="f"||sex==="female")?base-161:base+5;
}
function calcTDEE(sex,kg,cm,age,pal){
  return calcBMR(sex,kg,cm,age)*resolvePal(pal);
}
function calcWeeklyRate(start,target,days){
  const d=Number(days)||0;
  if(d<=0)return 0;
  return((Number(start)-Number(target))/(d/7));
}
function calcCaloriePlan(plan){
  const sex=plan.sex||"m";
  const bmr=calcBMR(sex,plan.startWeight,plan.height,plan.age);
  const pal=resolvePal(plan.pal||plan.workType);
  const tdee=bmr*pal;
  const floor=(sex==="f"||sex==="female")?1200:1500;
  const goal=plan.goal||"loss";
  let recMin=Math.round(tdee),recMax=Math.round(tdee),recTarget=Math.round(tdee),clamped=false;
  if(goal==="loss"){
    const rawMin=Math.round(tdee-500),rawMax=Math.round(tdee-300),rawT=Math.round(tdee-400);
    if(rawMin<floor||rawT<floor){clamped=true}
    recMin=Math.max(floor,rawMin);
    recMax=Math.max(floor,rawMax);
    recTarget=Math.max(floor,rawT);
  }else if(goal==="gain"){
    recMin=Math.round(tdee+300);
    recMax=Math.round(tdee+500);
    recTarget=Math.round(tdee+400);
  }
  return{bmr,tdee,bmrRound:Math.round(bmr),tdeeRound:Math.round(tdee),floor,recMin,recMax,recTarget,clamped};

function canStart(plan){
  if(!plan||typeof plan!=="object")return{ok:false,blocked:true,code:"invalid",reason:"Invalid plan"};
  const goal=plan.goal||"loss";
  const sex=plan.sex||"m";
  const sw=Number(plan.startWeight),tw=Number(plan.targetWeight),ht=Number(plan.height),age=Number(plan.age),days=Number(plan.totalDays||plan.days);
  if(sex==="f"&&plan.preg==="yes"){
    return{ok:false,blocked:true,safetyStop:true,code:"preg_stop",reason:lang==="zh"?"孕期或哺乳期请停止使用并咨询专科医生。":"임신·수유 중에는 도전을 시작할 수 없습니다. 전문의와 상담하세요."};
  }
  if(plan.ed==="high"){
    return{ok:false,blocked:true,safetyStop:true,code:"ed_stop",reason:lang==="zh"?"存在高频极端节食或暴食风险，请停止使用并寻求专业医疗帮助。":"섭식장애(극단 절식·폭식) 고위험군으로 도전을 시작할 수 없습니다. 전문의 상담을 권장합니다."};
  }
  if(!sw||sw<30||sw>300||!tw||tw<30||tw>300||!ht||ht<100||ht>250||!age||age<15||age>100||!days||days<7||days>180){
    return{ok:false,blocked:true,code:"range",reason:lang==="zh"?"请输入有效的身体数据与天数(7~180天)。":"나이, 키, 체중, 기간(7~180일)을 올바르게 입력하세요."};
  }
  if(plan.med&&plan.med!=="none"&&!plan.medAck){
    return{ok:false,blocked:true,code:"med_ack",reason:lang==="zh"?"请确认已与医生沟通后再继续。":"질환·복용 약이 있는 경우 '의사와 상의 후 진행' 확인이 필요합니다."};
  }
  const hM=ht/100,bmi=sw/(hM*hM);
  if(goal==="loss"){
    if(bmi<18.5){
      return{ok:false,blocked:true,code:"underweight",reason:lang==="zh"?`当前 BMI (${bmi.toFixed(1)}) 低于 18.5（偏瘦），系统已拦截减重计划。`:`현재 저체중(BMI ${bmi.toFixed(1)} < 18.5)이므로 감량 도전을 시작할 수 없습니다.`};
    }
    if(tw>=sw){
      return{ok:false,blocked:true,code:"loss_dir",reason:lang==="zh"?"减重模式下目标体重必须低于当前体重（或切换为增重/维持模式）。":"감량 모드에서는 목표 체중이 현재 체중보다 낮아야 합니다. (증량/유지 모드로 전환하거나 목표를 수정하세요)"};
    }
    const rate=calcWeeklyRate(sw,tw,days);
    if(rate>2.0){
      return{ok:false,blocked:true,rate,code:"rate_over_2",reason:lang==="zh"?`周均减重 ${rate.toFixed(2)}kg/周 超过 2kg/周安全上限，已阻止开始。请延长天数或调高目标体重。`:`주당 감량 속도(${rate.toFixed(2)}kg/주)가 2kg/주를 초과하여 차단되었습니다. 기간을 늘리거나 목표 체중을 높여주세요.`};
    }
    if(rate>1.0){
      return{ok:false,blocked:true,warn:true,rate,code:"rate_over_1",reason:lang==="zh"?`⚠️ 强烈警告：周均减重 ${rate.toFixed(2)}kg/周 超过 1kg/周建议值！请重新调整挑战天数或目标体重至 ≤1kg/周。`:`⚠️ 강한 경고: 주당 감량 속도가 ${rate.toFixed(2)}kg/주로 권장 기준(1kg/주)을 초과합니다. 건강을 위해 기간을 늘리거나 목표 체중을 다시 설정하세요.`};
    }
  }else if(goal==="gain"){
    if(tw<=sw){
      return{ok:false,blocked:true,code:"gain_dir",reason:lang==="zh"?"增重模式下目标体重必须高于当前体重（或切换为减重/维持模式）。":"증량 모드에서는 목표 체중이 현재 체중보다 높아야 합니다. (감량/유지 모드로 전환하거나 목표를 수정하세요)"};
    }
    const gRate=Math.abs(calcWeeklyRate(sw,tw,days));
    if(gRate>1.5){
      return{ok:false,blocked:true,warn:true,rate:gRate,code:"gain_rate",reason:lang==="zh"?`⚠️ 周均增重 ${gRate.toFixed(2)}kg/周 过快，请延长天数或调整目标体重。`:`⚠️ 주당 증량 속도(${gRate.toFixed(2)}kg/주)가 너무 빠릅니다. 기간이나 목표 체중을 다시 조정해주세요.`};
    }
  }
  return{ok:true,blocked:false,code:"ok",rate:calcWeeklyRate(sw,tw,days)};
}

function sdf(date,f,v){if(!data[date])data[date]={};data[date][f]=v;saveD(data);toast((lang==="zh"?"已保存":"저장")+" ✓");render()}

function totalStars(){return Object.entries(data).filter(([k,v])=>v.quests&&Object.values(v.quests).filter(Boolean).length===QT&&!isSun(k)).length}
function getLvl(){let l=0;for(let i=LVLS.length-1;i>=0;i--)if(usr.xp>=LVLS[i]){l=i;break}return l}
function getLN(l){return lang==="zh"?LN_ZH[l]:LN_KO[l]}

function getWeeklyLoss(){if(!cfg)return 0;const ws=Object.entries(data).filter(([,v])=>v.weight).sort((a,b)=>a[0].localeCompare(b[0]));if(ws.length<2)return 0;const first=ws[0],last=ws[ws.length-1],days=dBtw(first[0],last[0]);if(days<3)return 0;return((first[1].weight-last[1].weight)/days*7).toFixed(1)}
function getPredictDate(){const rate=parseFloat(getWeeklyLoss());if(!cfg)return"--";if(cfg.goal==="maintain")return lang==="zh"?"维持中":"유지 중";if(cfg.goal==="gain"){if(rate>=0)return"--";const toGain=cfg.targetWeight-latestW();if(toGain<=0)return lang==="zh"?"已达标！":"달성!";const wks=toGain/Math.abs(rate);return fmtD(addD(td(),Math.ceil(wks*7)))}if(rate<=0)return"--";const toGo=latestW()-cfg.targetWeight;if(toGo<=0)return lang==="zh"?"已达标！":"달성!";const weeks=toGo/rate;const days=Math.ceil(weeks*7);return fmtD(addD(td(),days))}
function weeklyRate(){if(!cfg)return 0;const wd=dow(td()),start=addD(td(),-wd);let total=0,done=0;for(let i=0;i<7;i++){const ds=addD(start,i);if(ds>td()||ds<cfg.startDate||ds>cfg.endDate)continue;if(isSun(ds))continue;total++;if(data[ds]&&data[ds].quests&&Object.values(data[ds].quests).filter(Boolean).length>=7)done++}return total?Math.round(done/total*100):0}

function getExportObject(){
  return{
    b60lang:lang,
    burn60_config:cfg,
    burn60_data:data,
    burn60_user:usr
  };
}
function exportBackup(){
  const payload=getExportObject();
  const json=JSON.stringify(payload,null,2);
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const dStr=td().replace(/-/g,"");
  a.href=url;
  a.download=`burn60_backup_${dStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),500);
  toast(lang==="zh"?"已导出备份 ✓":"백업 내보내기 완료 ✓");
  return payload;
}
function validateBackupObj(obj){
  if(!obj||typeof obj!=="object"||Array.isArray(obj))return false;
  const reqKeys=["b60lang","burn60_config","burn60_data","burn60_user"];
  for(const k of reqKeys){if(!(k in obj))return false}
  if(typeof obj.b60lang!=="string"||(obj.b60lang!=="ko"&&obj.b60lang!=="zh"))return false;
  if(obj.burn60_config!==null){
    if(typeof obj.burn60_config!=="object"||Array.isArray(obj.burn60_config))return false;
    if(!obj.burn60_config.startDate||!obj.burn60_config.totalDays||!obj.burn60_config.startWeight)return false;
  }
  if(!obj.burn60_data||typeof obj.burn60_data!=="object"||Array.isArray(obj.burn60_data))return false;
  if(!obj.burn60_user||typeof obj.burn60_user!=="object"||Array.isArray(obj.burn60_user)||typeof obj.burn60_user.xp!=="number")return false;
  return true;
}
function applyBackupObject(rawInput,skipConfirm){
  let obj=rawInput;
  if(typeof rawInput==="string"){
    try{obj=JSON.parse(rawInput)}catch(e){toast(lang==="zh"?"无效的JSON文件":"유효하지 않은 JSON 파일");return false}
  }
  if(!validateBackupObj(obj)){
    toast(lang==="zh"?"备份文件格式错误":"백업 파일 구조가 올바르지 않습니다");
    return false;
  }
  if(!skipConfirm){
    const ok=confirm(lang==="zh"?"导入备份将覆盖当前数据，确定继续？":"백업을 가져오면 현재 데이터를 덮어씁니다. 계속할까요?");
    if(!ok)return false;
  }
  lang=obj.b60lang;
  try{localStorage.setItem("b60lang",lang)}catch(e){}
  if(obj.burn60_config){
    cfg=Object.assign({},obj.burn60_config,{schemaVersion:2});
    saveC(cfg);
  }else{
    cfg=null;
    try{localStorage.removeItem(CK)}catch(e){}
  }
  data=obj.burn60_data;
  saveD(data);
  usr=obj.burn60_user;
  saveU(usr);
  syncDocLang();
  render();
  toast(lang==="zh"?"备份导入成功 ✓":"백업 가져오기 완료 ✓");
  return true;
}
function triggerImport(){
  const inp=document.getElementById("import-file-input");
  if(inp)inp.click();
}
function handleImportFile(ev){
  const file=ev.target&&ev.target.files&&ev.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    applyBackupObject(e.target.result,false);
    ev.target.value="";
  };
  reader.readAsText(file);
}

          <button type="button" class="ob-opt ${ob.sleep==="normal"?"on":""}" onclick="setObField('sleep','normal')">${z?"6~8小时":"6~8시간"}</button>
        </div>
        <div class="ob-q">${z?"饮食预算与家常菜偏好":"식비 예산 및 한식/중식 가정식 선호"}</div>
        <div class="ob-opts">
          <button type="button" class="ob-opt ${ob.cuisine==="ko"?"on":""}" onclick="setObField('cuisine','ko')">🍚 ${z?"韩式家常":"한식 가정식"}</button>
          <button type="button" class="ob-opt ${ob.cuisine==="zh"?"on":""}" onclick="setObField('cuisine','zh')">🥟 ${z?"中式家常":"중식 가정식"}</button>
        </div>
        <div class="ob-q">${z?"运动经验":"운동 경험"}</div>
        <div class="ob-opts">
          <button type="button" class="ob-opt ${ob.exp==="beginner"?"on":""}" onclick="setObField('exp','beginner')">${z?"新手":"초보"}</button>
          <button type="button" class="ob-opt ${ob.exp==="inter"?"on":""}" onclick="setObField('exp','inter')">${z?"有基础":"경험 있음"}</button>
        </div>
        <div class="sf"><label class="sl" for="s-motive">${z?"过去尝试 / 本次动力":"과거 시도·이번 동기 (선택)"}</label><input class="si" style="font-size:13px" type="text" id="s-motive" value="${ob.motive}" placeholder="${z?"写下你的目标动力":"이번에 꼭 달성하고 싶은 이유"}"></div>
      </div>
      <div class="ob-nav">
        <button type="button" class="ob-btn2" data-testid="btn-prev" onclick="obPrev()">← ${z?"上一步":"이전"}</button>
        <button type="button" class="sbtn" style="margin-top:0;flex:2" data-testid="btn-start" onclick="startC()">${t("start")}</button>
      </div>`;
  }

  return`<div class="setup" style="justify-content:flex-start;padding:20px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:26px">🔥</span><span class="setup-title" style="font-size:20px;margin:0">${t("appTitle")}</span></div>
      <button type="button" class="lang-btn" data-testid="btn-lang" onclick="toggleLang()">${lang==="zh"?"한국어":"中文"}</button>
    </div>
    ${stepHtml}
    <div class="disc" data-testid="disclaimer-setup">⚠️ ${t("disclaimer")}</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button type="button" class="ebtn" style="margin:0" data-testid="btn-import" onclick="triggerImport()">${t("importBtn")}</button>
      <input type="file" id="import-file-input" data-testid="import-file" accept=".json,application/json" style="display:none" onchange="handleImportFile(event)">
    </div>
    <div class="shint">${t("dataHint")}</div>
  </div>`;
}

// ═══ RENDER ═══
function render(){const app=document.getElementById("app");
if(!cfg){app.innerHTML=renderOnboarding();return}
const today2=td(),tD=data[today2]||{},rawEl=dBtw(cfg.startDate,today2),el=Math.max(0,Math.min(cfg.totalDays-1,rawEl)),left=Math.max(0,dBtw(today2,cfg.endDate)),pct=Math.min(100,Math.round(((el+1)/cfg.totalDays)*100)),lw=latestW(),diffW=lw-cfg.startWeight,toGo=Math.abs(cfg.targetWeight-lw),streak=getStreak(),sun=isSun(today2),qDn=qsDone(today2),qPct=sun?100:Math.round(qDn/QT*100),lvl=getLvl(),nxXp=LVLS[Math.min(lvl+1,LVLS.length-1)],xpP=lvl<LVLS.length-1?Math.round((usr.xp-LVLS[lvl])/(nxXp-LVLS[lvl])*100):100;
const calInfo=calcCaloriePlan(cfg);
let nav=`<div class="bnav">`;[["quest","⚔️",t("quest")],["weight","⚖️",t("weight")],["history","📅",t("history")],["stats","🏅",t("stats")]].forEach(([k,ic,l])=>{nav+=`<button class="${curView===k?"act":""}" data-testid="nav-${k}" onclick="curView='${k}';render()"><span class="ni">${ic}</span>${l}</button>`});nav+=`</div>`;
let b="";
// ═══ QUEST ═══
if(curView==="quest"){
if(sun){b=`<div class="rest"><div class="re">😴</div><div class="rt">${t("rest")}</div><div class="rs">${t("restSub").replace(/\n/g,"<br>")}</div></div>`}
else{const qs=tD.quests||{},quests=getQuests();
b+=`<div class="gc"><div class="ds"><div class="rw">${ringSvg(qPct,66)}<div class="rtx"><div class="rn">${qDn}/${QT}</div><div class="rl">${t("done")}</div></div></div><div class="dst"><div class="dsr"><span class="dsl">D${el+1}/${cfg.totalDays} · ${fmtD(today2)}</span><span class="streak-b">🔥 ${streak}${t("day")}</span></div><div class="dsr"><span class="dsl">${t("left")}</span><span class="dsv" style="color:var(--eb)">${left}${t("day")}</span></div><div class="dsr"><span class="dsl">${lang==="zh"?"建议每日总热量":"하루 권장 총 섭취량"}</span><span class="dsv" style="color:var(--cy)">${calInfo.recMin.toLocaleString()}~${calInfo.recMax.toLocaleString()} kcal</span></div><div class="xpbar"><div class="xpfill" style="width:${xpP}%"></div></div><div class="xplbl">Lv.${lvl+1} ${getLN(lvl)} · ${usr.xp}/${nxXp} XP</div></div></div></div>`;
let lt="";quests.forEach(q=>{const dn=!!qs[q.id];if(q.time!==lt){b+=`<div class="qt">${q.time}<span class="ql"></span></div>`;lt=q.time}b+=`<div class="qi ${dn?"dn":""}" data-testid="quest-${q.id}" onclick="toggleQ('${today2}','${q.id}')"><div class="qc">${dn?"✓":""}</div><div class="qct"><div class="t">${q.title}</div>${q.desc?`<div class="d">${q.desc}</div>`:""}</div><div class="qe">${q.emoji}</div></div>`;if(q.id==="dn"){b+=`<div class="gc2"><div class="ct2">${t("dinnerTitle")} <span style="font-size:10px;color:var(--cy);font-weight:500">(${lang==="zh"?"每日建议总摄入":"일일 총 권장"}: ${calInfo.recMin.toLocaleString()}~${calInfo.recMax.toLocaleString()} kcal)</span></div>`;DCATS.forEach((cat,ci)=>{const nt=dcatNote(cat);b+=`<div class="mc ${openCats[ci]?"op":""}"><div class="mct" onclick="openCats[${ci}]=!openCats[${ci}];render()">${cat.icon} ${dcatName(cat)} <span class="mn">${nt}</span></div><div class="ml">${cat.items.map(i=>`<div class="mi">· ${dcatItem(i)}</div>`).join("")}</div></div>`});b+=`</div>`}});
if(qDn===QT&&!tD.gamePlayed)b+=`<div style="text-align:center;padding:12px"><button class="game-btn" onclick="showGameIntro()">${t("gameUnlock")} 🎮</button></div>`}}
// ═══ WEIGHT ═══
if(curView==="weight"){
const bmi=getBMI(),wl=getWeeklyLoss(),pred=getPredictDate();
const sign=diffW>0?"+":diffW<0?"-":"";
b+=`<div class="gc"><div class="cr"><div><div class="bn glow-cy">${lw}kg</div><div class="dm">${t("current")}</div></div><div style="text-align:right"><div class="bn" style="color:${diffW<=0?"var(--cy)":"var(--ny)"}">${sign}${Math.abs(diffW).toFixed(1)}</div><div class="dm">${t("reduced")}(kg)</div></div></div><div class="pb"><div class="pf" style="width:${pct}%"></div></div><div class="plb">${cfg.startWeight}kg → ${cfg.targetWeight}kg · ${t("toGoal")} ${toGo.toFixed(1)}kg</div></div>`;
b+=`<div class="gc"><div class="cr"><div class="sb"><div class="sn" style="color:var(--nv)">${bmi||"--"}</div><div class="dm">${t("bmi")}</div></div><div class="sb"><div class="sn" style="color:var(--ny)">${wl||"--"}kg</div><div class="dm">${t("wkLoss")}</div></div><div class="sb"><div class="sn" style="color:var(--mg)">${pred}</div><div class="dm">${t("predict")}</div></div></div></div>`;
b+=`<div class="gc"><div class="ct2">⚖️ ${t("rec")}</div><div style="font-size:10px;color:#556">${t("recTip")}</div><div class="ir"><label for="wi" class="sl" style="display:none">${t("rec")}</label><input type="number" step="0.1" placeholder="kg" id="wi" aria-label="${t("rec")}" value="${tD.weight||""}"/><button class="svb" onclick="saveW()">${t("save")}</button></div>${tD.weight?`<div class="svh">${t("saved").replace("%s",tD.weight)}</div>`:""}</div>`;
b+=`<div class="gc"><div class="ct2">📉 ${t("trend")}</div>${buildChart()}</div>`}
// ═══ HISTORY ═══
if(curView==="history"){
b+=`<div class="gc"><div class="ct2">📆 ${t("cal")} (${fmtD(cfg.startDate)} ~ ${fmtD(cfg.endDate)})</div>${buildCal()}<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><span style="font-size:8px;color:var(--cy)">■ ≥80%</span><span style="font-size:8px;color:var(--ny)">■ ≥50%</span><span style="font-size:8px;color:var(--np)">■ <50%</span><span style="font-size:8px;color:var(--nv)">■ ${lang==="zh"?"周日":"일"}</span></div></div>`;
const wr=weeklyRate();const wg=wr>=80?"S":wr>=60?"A":wr>=40?"B":wr>=20?"C":"D";const wgc=wr>=80?"var(--cy)":wr>=60?"var(--ny)":wr>=40?"var(--eb)":"var(--np)";
b+=`<div class="gc"><div class="ct2">📊 ${t("wkReport")}</div><div class="cr"><div class="wr-box"><div class="wr-grade" style="color:${wgc};text-shadow:0 0 15px ${wgc}">${wg}</div><div class="wr-label">${lang==="zh"?"等级":"등급"}</div></div><div class="sb"><div class="sn" style="color:${wgc}">${wr}%</div><div class="dm">${t("wkRate")}</div></div><div class="sb"><div class="sn">${avgRate()}%</div><div class="dm">${t("avgRate")}</div></div></div></div>`;
const days=Math.min(el+1,cfg.totalDays);let h="";
for(let i=0;i<days;i++){const ds=addD(cfg.startDate,days-1-i),e=data[ds]||{},isT=ds===today2,di=dBtw(cfg.startDate,ds),s2=isSun(ds);const qd=s2?"🌙":e.quests?Object.values(e.quests).filter(Boolean).length+"/"+QT:"0/"+QT;const qp2=s2?100:e.quests?Math.round(Object.values(e.quests).filter(Boolean).length/QT*100):0;const pc=s2?"var(--nv)":qp2>=80?"var(--cy)":qp2>=50?"var(--ny)":"var(--np)";h+=`<div class="hi"><div class="hd">${isT?t("today"):fmtD(ds)}${s2?" 🌙":""}<span class="hdy">D${di+1}</span></div><div class="hic">${e.weight?`<span class="hw">${e.weight}kg</span>`:'<span class="hn">--</span>'}<span class="hp" style="color:${pc}">${qd}</span></div></div>`}
b+=`<div class="gc"><div class="ct2">📋 ${t("histTitle")}</div><div class="hl">${h||`<div class="ech">${t("noData")}</div>`}</div></div>`}
// ═══ STATS & SETTINGS ═══
if(curView==="stats"){
const modeLabel=cfg.goal==="gain"?(lang==="zh"?"增重":"증량"):cfg.goal==="maintain"?(lang==="zh"?"维持":"유지"):(cfg.preset==="flex"?(lang==="zh"?"减重 (温和日常)":"감량 (완화된 루틴)"):(lang==="zh"?"减重 (经典严格)":"감량 (기존 루틴)"));
b+=`<div class="gc"><div class="cr"><div><div style="font-size:10px;color:#667">${t("level")}</div><div style="font-size:28px;font-weight:800;color:var(--ny);text-shadow:0 0 15px rgba(240,255,0,.3)">Lv.${lvl+1}</div><div style="font-size:12px;font-weight:700;color:var(--mg);text-shadow:0 0 8px rgba(255,0,255,.3)">${getLN(lvl)}</div></div><div style="text-align:right"><div style="font-size:10px;color:#667">${t("xp")}</div><div class="sn" style="color:var(--ny)">${usr.xp}</div><div style="font-size:9px;color:#445">${lang==="zh"?"下一级":"다음"}: ${nxXp}</div></div></div><div class="xpbar" style="margin-top:8px"><div class="xpfill" style="width:${xpP}%"></div></div></div>`;
b+=`<div class="gc"><div class="ct2">${t("stats")}</div><div class="cr"><div class="sb"><div class="sn glow-cy">${totalStars()}</div><div class="dm">⭐ ${t("stars")}</div></div><div class="sb"><div class="sn glow-ny">${streak}</div><div class="dm">🔥 ${t("streak")}</div></div></div><div class="cr" style="margin-top:8px"><div class="sb"><div class="sn" style="color:var(--eb)">${weeklyRate()}%</div><div class="dm">${t("wkRate")}</div></div><div class="sb"><div class="sn" style="color:var(--nv)">${avgRate()}%</div><div class="dm">${t("avgRate")}</div></div></div><div class="cr" style="margin-top:8px"><div class="sb"><div class="sn">${Object.values(data).filter(v=>v.weight).length}</div><div class="dm">${t("recCnt")}</div></div><div class="sb"><div class="sn">${el+1}</div><div class="dm">${t("elapsed")}</div></div></div></div>`;
b+=`<div class="gc"><div class="ct2">🏅 ${t("badges")}</div><div style="display:flex;flex-wrap:wrap;gap:3px">`;
BDEFS.forEach(bd=>{const u=bd.ck();b+=`<div class="bdg ${u?"":"locked"}">${bd.icon} ${lang==="zh"?bd.zh:bd.ko}</div>`});
b+=`</div><div class="bdg-next">${lang==="zh"?"▸ 下个":"▸ 다음"}: ${nextBadge()}</div></div>`;
b+=`<div class="gc"><div class="ct2">⚙️ ${t("info")}</div><div class="info-r"><span class="info-l">${lang==="zh"?"模式 / 方案":"모드 / 프리셋"}</span><span class="info-v">${modeLabel}${cfg.muscle?(lang==="zh"?" +增肌":" +근육강화"):""}</span></div><div class="info-r"><span class="info-l">${t("startD")} ~ ${t("endD")}</span><span class="info-v" data-testid="info-dates">${cfg.startDate} ~ ${cfg.endDate}</span></div><div class="info-r"><span class="info-l">${t("curW")}</span><span class="info-v">${cfg.startWeight}kg → ${cfg.targetWeight}kg</span></div><div class="info-r"><span class="info-l">${t("days")}</span><span class="info-v">${cfg.totalDays}${t("day")}</span></div><div class="info-r"><span class="info-l">BMR / TDEE</span><span class="info-v">${calInfo.bmrRound.toLocaleString()} / ${calInfo.tdeeRound.toLocaleString()} kcal</span></div><div class="info-r"><span class="info-l">${lang==="zh"?"建议每日总摄入":"권장 일일 섭취량"}</span><span class="info-v">${calInfo.recMin.toLocaleString()}~${calInfo.recMax.toLocaleString()} kcal</span></div><div class="info-r"><span class="info-l">${lang==="zh"?"语言切换":"언어 설정"}</span><span class="info-v"><button type="button" class="lang-btn" onclick="toggleLang()">${lang==="zh"?"한국어로 전환":"中文切换"}</button></span></div></div>`;
b+=`<button type="button" class="ebtn" style="opacity:1" data-testid="btn-export" onclick="exportBackup()">${t("exportBtn")}</button>`;
b+=`<button type="button" class="ebtn" style="opacity:1" data-testid="btn-import" onclick="triggerImport()">${t("importBtn")}</button>`;
b+=`<input type="file" id="import-file-input" data-testid="import-file" accept=".json,application/json" style="display:none" onchange="handleImportFile(event)">`;
b+=`<button type="button" class="ebtn" data-testid="btn-end" onclick="endC()">${t("end")}</button><button type="button" class="rbtn" data-testid="btn-reset" onclick="resetAll()">${t("reset")}</button>`}
const footerDisc=`<div class="disc" data-testid="disclaimer-footer">⚠️ ${t("disclaimer")}</div>`;
app.innerHTML=`<div class="hdr"><div class="logo">🔥 ${t("appTitle")}</div><div class="hdr-r"><span class="lvl-b">Lv.${lvl+1} ${getLN(lvl)}</span><button type="button" class="lang-btn" data-testid="btn-lang" onclick="toggleLang()">${lang==="zh"?"한국어":"中文"}</button></div></div><div class="hdr-sub">${cfg.startWeight}kg → ${cfg.targetWeight}kg · ${cfg.totalDays}${t("day")} (${cfg.startDate}~${cfg.endDate})</div><div class="ct">${b}${footerDisc}</div>${nav}`}

function startC(customPlan){
  syncObInputs();
  const p=customPlan||ob;
  const sw=parseFloat(p.startWeight),ht=parseFloat(p.height),age=parseInt(p.age,10)||35,days=parseInt(p.totalDays||p.days,10);
  const goal=p.goal||"loss";
  const tw=goal==="maintain"?sw:parseFloat(p.targetWeight);
  const fullPlan=Object.assign({},ob,p,{goal,startWeight:sw,targetWeight:tw,height:ht,age,totalDays:days,days});
  const check=canStart(fullPlan);
  if(!check.ok){
    toast(check.reason);
    return check;
  }
  const startDate=p.startDate||td();
  const endDate=addD(startDate,days-1);
  const cal=calcCaloriePlan(fullPlan);
  cfg={
    schemaVersion:2,
    goal,
    muscle:!!fullPlan.muscle,
    sex:fullPlan.sex||"m",
    age,
    height:ht,
    startWeight:sw,
    targetWeight:tw,
    totalDays:days,
    startDate,
    endDate,
    med:fullPlan.med||"none",
    medAck:!!fullPlan.medAck,
    pains:Array.isArray(fullPlan.pains)?fullPlan.pains:["none"],
    preg:fullPlan.preg||"no",
    ed:fullPlan.ed||"none",
    workType:fullPlan.workType||"standing",
    pal:resolvePal(fullPlan.pal||fullPlan.workType),
    mealType:fullPlan.mealType||"out",
    allergy:fullPlan.allergy||"none",
    allergyMemo:fullPlan.allergyMemo||"",
    exTime:fullPlan.exTime||"10",
    exPlace:fullPlan.exPlace||"shop",
    preset:goal==="loss"?(fullPlan.preset||"flex"):goal,
    bmr:cal.bmrRound,
    tdee:cal.tdeeRound,
    recCalMin:cal.recMin,
    recCalMax:cal.recMax
  };
  saveC(cfg);
  data={};
  data[startDate]={weight:sw};
  saveD(data);
  usr={xp:0};
  saveU(usr);
  curView="quest";
  toast(lang==="zh"?"挑战开始！💪":"도전 시작! 💪");
  render();
  return{ok:true,cfg};
}
function saveW(){const v=parseFloat(document.getElementById("wi").value);if(v>30&&v<300)sdf(td(),"weight",v);else toast(lang==="zh"?"请输入有效体重":"유효한 체중")}
function endC(skipConfirm){if(skipConfirm||confirm(lang==="zh"?"确定结束？":"종료할까요?")){localStorage.removeItem(CK);localStorage.removeItem(DK);localStorage.removeItem(UK);cfg=null;data={};usr={xp:0};obStep=1;curView="quest";render()}}
function resetAll(skipConfirm){if(skipConfirm||confirm(lang==="zh"?"清除所有？不可恢复":"전체 삭제? 복구 불가")){localStorage.removeItem(CK);localStorage.removeItem(DK);localStorage.removeItem(UK);cfg=null;data={};usr={xp:0};obStep=1;curView="quest";render()}}

// ═══ TEST & VERIFICATION HOOKS ═══
window.__burn60={
  bmr:calcBMR,
  tdee:calcTDEE,
  weeklyRate:calcWeeklyRate,
  caloriePlan:calcCaloriePlan,
  canStart:canStart,
  startChallenge:startC,
  exportData:getExportObject,
  importData:(obj,skipConfirm=true)=>applyBackupObject(obj,skipConfirm),
  resetAll:(skipConfirm=true)=>resetAll(skipConfirm),
  getQuests:getQuests,
  getConfig:()=>cfg,
  setLang:setLang
};
render();
</script>
